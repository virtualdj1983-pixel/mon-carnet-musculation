<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon Carnet Musculation</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111;
    color:#fff;
}

header{
    padding:22px 15px;
    text-align:center;
    background:linear-gradient(135deg,#181818,#252525);
    border-bottom:1px solid #333;
}

header h1{
    margin:0;
    font-size:25px;
}

header p{
    margin:8px 0 0;
    color:#aaa;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:15px;
}

.categories{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-bottom:20px;
}

button{
    border:0;
    border-radius:10px;
    padding:13px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.cat{
    background:#252525;
    color:white;
}

.cat:hover{
    background:#333;
}

.form{
    background:#1b1b1b;
    padding:18px;
    border-radius:15px;
    margin-bottom:20px;
    border:1px solid #333;
}

.form h2{
    margin-top:0;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    margin:7px 0 12px;
    border-radius:8px;
    border:1px solid #444;
    background:#111;
    color:white;
    font-size:15px;
}

textarea{
    min-height:90px;
    resize:vertical;
}

.save{
    width:100%;
    background:#00c853;
    color:white;
}

.status{
    text-align:center;
    padding:10px;
    color:#aaa;
}

.exercise{
    background:#1b1b1b;
    border:1px solid #333;
    border-radius:15px;
    padding:15px;
    margin-bottom:15px;
}

.exercise h3{
    margin-top:0;
    font-size:20px;
}

.exercise p{
    color:#ccc;
    line-height:1.5;
}

.exercise img,
.exercise video{
    width:100%;
    max-height:400px;
    object-fit:contain;
    border-radius:10px;
    margin-top:10px;
    background:#000;
}

.delete{
    background:#d50000;
    color:white;
    margin-top:10px;
    width:100%;
}

@media(min-width:700px){

    .categories{
        grid-template-columns:repeat(3,1fr);
    }

}
</style>
</head>

<body>

<header>

    <h1>🏋️ Mon Carnet Musculation</h1>

    <p>
        Mes exercices, vidéos, photos et notes
    </p>

</header>

<div class="container">

    <div class="categories">

        <button class="cat"
                onclick="filtrer('Pectoraux')">
            💪 Pectoraux
        </button>

        <button class="cat"
                onclick="filtrer('Dos')">
            🔙 Dos
        </button>

        <button class="cat"
                onclick="filtrer('Épaules')">
            🏋️ Épaules
        </button>

        <button class="cat"
                onclick="filtrer('Biceps')">
            💪 Biceps
        </button>

        <button class="cat"
                onclick="filtrer('Triceps')">
            💪 Triceps
        </button>

        <button class="cat"
                onclick="filtrer('Jambes')">
            🦵 Jambes
        </button>

        <button class="cat"
                onclick="filtrer('Abdos')">
            🔥 Abdos
        </button>

        <button class="cat"
                onclick="filtrer('Photos')">
            📷 Photos
        </button>

        <button class="cat"
                onclick="filtrer('Notes')">
            📝 Notes
        </button>

        <button class="cat"
                onclick="chargerExercices()">
            🏠 Tout afficher
        </button>

    </div>


    <div class="form">

        <h2>➕ Ajouter un exercice</h2>


        <label>Catégorie</label>

        <select id="categorie">

            <option>Pectoraux</option>
            <option>Dos</option>
            <option>Épaules</option>
            <option>Biceps</option>
            <option>Triceps</option>
            <option>Jambes</option>
            <option>Abdos</option>
            <option>Photos</option>
            <option>Notes</option>

        </select>


        <label>Nom de l'exercice</label>

        <input
            id="nom"
            placeholder="Exemple : Développé couché"
        >


        <label>Description</label>

        <textarea
            id="description"
            placeholder="Technique, conseils, matériel..."
        ></textarea>


        <label>Séries</label>

        <input
            id="series"
            type="number"
            placeholder="4"
        >


        <label>Répétitions</label>

        <input
            id="repetitions"
            type="number"
            placeholder="10"
        >


        <label>Vidéo de démonstration</label>

        <input
            id="video"
            type="file"
            accept="video/*"
        >


        <label>Photo</label>

        <input
            id="photo"
            type="file"
            accept="image/*"
        >


        <button
            class="save"
            onclick="ajouterExercice()"
        >
            💾 Enregistrer l'exercice
        </button>


        <div
            id="status"
            class="status"
        ></div>

    </div>


    <h2>📚 Mes exercices</h2>


    <div id="liste"></div>

</div>


<script>

const SUPABASE_URL =
    "https://cjtgjwepiotuhtfqwanw.supabase.co";


const SUPABASE_ANON_KEY =
    "sb_publishable_DXMY1V9ir7R_vwuFysSWwA_Pe-r5NNP";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


async function ajouterFichier(fichier){

    if(!fichier){

        return null;

    }


    const nomUnique =
        Date.now() +
        "_" +
        Math.random()
            .toString(36)
            .substring(2) +
        "_" +
        fichier.name
            .replace(
                /[^a-zA-Z0-9._-]/g,
                "_"
            );


    const { error } =
        await supabaseClient
        .storage
        .from("medias")
        .upload(
            nomUnique,
            fichier
        );


    if(error){

        throw error;

    }


    const { data } =
        supabaseClient
        .storage
        .from("medias")
        .getPublicUrl(
            nomUnique
        );


    return data.publicUrl;

}


async function ajouterExercice(){

    const status =
        document.getElementById(
            "status"
        );


    status.textContent =
        "⏳ Enregistrement en cours...";


    try{

        const categorie =
            document.getElementById(
                "categorie"
            ).value;


        const nom =
            document.getElementById(
                "nom"
            ).value.trim();


        const description =
            document.getElementById(
                "description"
            ).value.trim();


        const series =
            document.getElementById(
                "series"
            ).value;


        const repetitions =
            document.getElementById(
                "repetitions"
            ).value;


        const video =
            document.getElementById(
                "video"
            ).files[0];


        const photo =
            document.getElementById(
                "photo"
            ).files[0];


        if(!nom){

            alert(
                "Entre le nom de l'exercice."
            );

            status.textContent = "";

            return;

        }


        let videoUrl = null;

        let photoUrl = null;


        if(video){

            status.textContent =
                "🎥 Envoi de la vidéo...";


            videoUrl =
                await ajouterFichier(
                    video
                );

        }


        if(photo){

            status.textContent =
                "📷 Envoi de la photo...";


            photoUrl =
                await ajouterFichier(
                    photo
                );

        }


        status.textContent =
            "💾 Enregistrement...";


        const { error } =
            await supabaseClient
            .from("exercices")
            .insert([{

                nom:nom,

                categorie:categorie,

                description:
                    description || null,

                series:
                    series
                    ? parseInt(series)
                    : null,

                repetitions:
                    repetitions
                    ? parseInt(repetitions)
                    : null,

                video_url:
                    videoUrl,
