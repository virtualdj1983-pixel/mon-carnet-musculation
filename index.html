<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon Carnet Musculation</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0b0f;
    color: white;
}

header {
    background: linear-gradient(135deg, #15151d, #24243a);
    padding: 25px 15px;
    text-align: center;
    border-bottom: 1px solid #333;
}

header h1 {
    margin: 0;
    font-size: 28px;
}

header p {
    color: #aaa;
    margin-bottom: 0;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 15px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 20px;
}

.stat {
    background: #17171f;
    border: 1px solid #292936;
    border-radius: 12px;
    padding: 15px;
    text-align: center;
}

.stat strong {
    display: block;
    font-size: 25px;
    margin-bottom: 5px;
}

.stat span {
    color: #999;
    font-size: 13px;
}

.section {
    background: #15151d;
    border: 1px solid #292936;
    border-radius: 15px;
    padding: 15px;
    margin-bottom: 20px;
}

.section h2 {
    margin-top: 0;
}

.categories {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

.category {
    border: 0;
    border-radius: 12px;
    padding: 16px 8px;
    background: #252533;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.category:hover {
    background: #343449;
}

.category.active {
    background: #ffffff;
    color: #111;
}

.all-button {
    width: 100%;
    margin-top: 10px;
    background: #3a3a4d;
}

input,
textarea,
select {
    width: 100%;
    padding: 13px;
    margin-top: 6px;
    margin-bottom: 14px;
    border-radius: 10px;
    border: 1px solid #383846;
    background: #0e0e14;
    color: white;
    font-size: 15px;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

label {
    display: block;
    color: #bbb;
    font-size: 14px;
}

button {
    font-family: inherit;
}

.save {
    width: 100%;
    padding: 15px;
    border: 0;
    border-radius: 12px;
    background: #ffffff;
    color: #111;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.cancel {
    width: 100%;
    padding: 13px;
    margin-top: 10px;
    border: 0;
    border-radius: 12px;
    background: #353542;
    color: white;
    cursor: pointer;
    display: none;
}

.message {
    text-align: center;
    margin-top: 12px;
    color: #8fff9a;
    min-height: 20px;
}

.search {
    margin-bottom: 15px;
}

.exercise {
    background: #1b1b25;
    border: 1px solid #30303e;
    border-radius: 14px;
    padding: 15px;
    margin-bottom: 12px;
}

.exercise h3 {
    margin-top: 0;
    margin-bottom: 8px;
}

.category-name {
    display: inline-block;
    padding: 5px 9px;
    background: #303044;
    border-radius: 20px;
    color: #ccc;
    font-size: 12px;
    margin-bottom: 10px;
}

.exercise p {
    color: #bbb;
    line-height: 1.5;
}

.exercise video {
    width: 100%;
    max-height: 450px;
    border-radius: 10px;
    margin-top: 10px;
    background: black;
}

.exercise img {
    width: 100%;
    max-height: 450px;
    object-fit: contain;
    border-radius: 10px;
    margin-top: 10px;
    background: #000;
}

.exercise-buttons {
    display: flex;
    gap: 10px;
    margin-top: 12px;
}

.edit,
.delete {
    flex: 1;
    border: 0;
    padding: 11px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
}

.edit {
    background: #33334a;
    color: white;
}

.delete {
    background: #52252b;
    color: white;
}

.empty {
    text-align: center;
    color: #888;
    padding: 25px 10px;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.gallery img {
    width: 100%;
    height: 150px;
    object-fit: cover;
    border-radius: 10px;
    background: #000;
}

.notes {
    white-space: pre-wrap;
    color: #ccc;
}

.selected-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.selected-title span {
    color: #aaa;
    font-size: 14px;
}

@media (max-width: 700px) {
    .categories {
        grid-template-columns: repeat(2, 1fr);
    }

    .stats {
        grid-template-columns: repeat(3, 1fr);
    }

    .gallery {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 420px) {
    header h1 {
        font-size: 24px;
    }

    .stat strong {
        font-size: 21px;
    }

    .category {
        font-size: 14px;
        padding: 14px 5px;
    }
}
</style>
</head>

<body>

<header>
    <h1>💪 Mon Carnet Musculation</h1>
    <p>Mes exercices, mes vidéos, mes photos et mes notes</p>
</header>

<div class="container">

    <div class="stats">

        <div class="stat">
            <strong id="statExercices">0</strong>
            <span>Exercices</span>
        </div>

        <div class="stat">
            <strong id="statPhotos">0</strong>
            <span>Photos</span>
        </div>

        <div class="stat">
            <strong id="statVideos">0</strong>
            <span>Vidéos</span>
        </div>

    </div>


    <div class="section">

        <h2>🏋️ Mes catégories</h2>

        <div class="categories">

            <button class="category"
                onclick="selectionnerCategorie('Pectoraux', this)">
                🏋️ Pectoraux
            </button>

            <button class="category"
                onclick="selectionnerCategorie('Dos', this)">
                🔥 Dos
            </button>

            <button class="category"
                onclick="selectionnerCategorie('Épaules', this)">
                💪 Épaules
            </button>

            <button class="category"
                onclick="selectionnerCategorie('Biceps', this)">
                💪 Biceps
            </button>

            <button class="category"
                onclick="selectionnerCategorie('Triceps', this)">
                💪 Triceps
            </button>

            <button class="category"
                onclick="selectionnerCategorie('Jambes', this)">
                🦵 Jambes
            </button>

            <button class="category"
                onclick="selectionnerCategorie('Abdos', this)">
                🔥 Abdos
            </button>

            <button class="category"
                onclick="selectionnerCategorie('Photos', this)">
                📷 Photos
            </button>

        </div>

        <button
            id="boutonTous"
            class="category all-button active"
            onclick="afficherTous(this)">
            📋 TOUS LES EXERCICES
        </button>

    </div>


    <div class="section">

        <div class="selected-title">

            <h2 id="titreListe">
                📋 Tous mes exercices
            </h2>

            <span id="filtreActuel">
                Tous
            </span>

        </div>

        <input
            id="recherche"
            class="search"
            type="search"
            placeholder="🔎 Rechercher un exercice..."
            oninput="rechercher()">

        <div id="listeExercices">
            <div class="empty">
                Chargement...
            </div>
        </div>

    </div>


    <div class="section" id="sectionFormulaire">

        <h2 id="titreFormulaire">
            ➕ Ajouter un exercice
        </h2>

        <label>
            Nom de l'exercice
        </label>

        <input
            id="nom"
            type="text"
            placeholder="Exemple : Développé couché">


        <label>
            Catégorie
        </label>

        <select id="categorie">

            <option value="Pectoraux">Pectoraux</option>
            <option value="Dos">Dos</option>
            <option value="Épaules">Épaules</option>
            <option value="Biceps">Biceps</option>
            <option value="Triceps">Triceps</option>
            <option value="Jambes">Jambes</option>
            <option value="Abdos">Abdos</option>
            <option value="Photos">Photos</option>
            <option value="Notes">Notes</option>

        </select>


        <label>
            Nombre de séries
        </label>

        <input
            id="series"
            type="number"
            min="0"
            placeholder="4">


        <label>
            Nombre de répétitions
        </label>

        <input
            id="repetitions"
            type="number"
            min="0"
            placeholder="10">


        <label>
            Description / notes
        </label>

        <textarea
            id="description"
            placeholder="Technique, poids, conseils, sensations..."></textarea>


        <label>
            🎥 Vidéo de démonstration
        </label>

        <input
            id="video"
            type="file"
            accept="video/*">


        <label>
            📷 Photo
        </label>

        <input
            id="photo"
            type="file"
            accept="image/*">


        <button
            id="boutonPrincipal"
            class="save"
            onclick="ajouterExercice()">
            💾 ENREGISTRER
        </button>


        <button
            id="boutonAnnuler"
            class="cancel"
            onclick="annulerModification()">
            ❌ ANNULER LA MODIFICATION
        </button>


        <div id="message" class="message"></div>

    </div>


    <div class="section">

        <h2>
            🖼️ Galerie photos
        </h2>

        <div id="galerie" class="gallery">

            <div class="empty">
                Aucune photo
            </div>

        </div>

    </div>


    <div class="section">

        <h2>
            📝 Notes
        </h2>

        <div id="listeNotes">

            <div class="empty">
                Aucune note
            </div>

        </div>

    </div>

</div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://cjtgjwepiotuhtfqwanw.supabase.co";

/*
   CLÉ PUBLISHABLE CORRECTE
*/
const SUPABASE_KEY =
"sb_publishable_DXMY1V9ir7R_vwuFysSWwA_Pe-r5NNP";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


let exercices = [];

let categorieActuelle = null;

let exerciceEnModification = null;


/* =========================================
   CHARGEMENT DES EXERCICES
========================================= */

async function chargerExercices() {

    const { data, error } =
        await supabaseClient
            .from("exercices")
            .select("*")
            .order("id", {
                ascending: false
            });


    if (error) {

        console.error(
            "Erreur Supabase :",
            error
        );

        document.getElementById(
            "listeExercices"
        ).innerHTML =
            '<div class="empty">❌ Erreur de chargement : ' +
            echapperHTML(error.message) +
            '</div>';

        return;
    }


    exercices = data || [];


    mettreAJourStats();

    afficherExercices();

    afficherGalerie();

    afficherNotes();
}


/* =========================================
   STATISTIQUES
========================================= */

function mettreAJourStats() {

    document.getElementById(
        "statExercices"
    ).textContent =
        exercices.length;


    document.getElementById(
        "statPhotos"
    ).textContent =
        exercices.filter(
            x => x.photo_url
        ).length;


    document.getElementById(
        "statVideos"
    ).textContent =
        exercices.filter(
            x => x.video_url
        ).length;
}


/* =========================================
   CATEGORIES
========================================= */

function selectionnerCategorie(
    categorie,
    bouton
) {

    categorieActuelle = categorie;


    document
        .querySelectorAll(".category")
        .forEach(
            b => b.classList.remove("active")
        );


    bouton.classList.add("active");


    document.getElementById(
        "titreListe"
    ).textContent =
        "📋 " + categorie;


    document.getElementById(
        "filtreActuel"
    ).textContent =
        categorie;


    document.getElementById(
        "recherche"
    ).value = "";


    afficherExercices();
}


function afficherTous(bouton) {

    categorieActuelle = null;


    document
        .querySelectorAll(".category")
        .forEach(
            b => b.classList.remove("active")
        );


    bouton.classList.add("active");


    document.getElementById(
        "titreListe"
    ).textContent =
        "📋 Tous mes exercices";


    document.getElementById(
        "filtreActuel"
    ).textContent =
        "Tous";


    document.getElementById(
        "recherche"
    ).value = "";


    afficherExercices();
}


/* =========================================
   AFFICHAGE DES EXERCICES
========================================= */

function afficherExercices() {

    const recherche =
        document
            .getElementById("recherche")
            .value
            .toLowerCase()
            .trim();


    let resultat = [
        ...exercices
    ];


    if (categorieActuelle) {

        if (
            categorieActuelle === "Photos"
        ) {

            resultat =
                resultat.filter(
                    exercice =>
                        exercice.photo_url
                );

        } else {

            resultat =
                resultat.filter(
                    exercice =>
                        exercice.categorie ===
                        categorieActuelle
                );
        }
    }


    if (recherche) {

        resultat =
            resultat.filter(
                exercice => {

                    const texte =
                        (
                            (exercice.nom || "") +
                            " " +
                            (exercice.description || "") +
                            " " +
                            (exercice.categorie || "")
                        )
                        .toLowerCase();


                    return texte.includes(
                        recherche
                    );

                }
            );
    }


    const liste =
        document.getElementById(
            "listeExercices"
        );


    if (resultat.length === 0) {

        liste.innerHTML =
            '<div class="empty">' +
            (
                categorieActuelle
                    ? "Aucun exercice dans cette catégorie."
                    : "Aucun exercice enregistré."
            ) +
            '</div>';

        return;
    }


    liste.innerHTML =
        resultat.map(
            exercice => {

                let media = "";


                if (exercice.video_url) {

                    media += `
                        <video
                            controls
                            preload="metadata">
                            <source
                                src="${echapperHTML(exercice.video_url)}">
                            Votre navigateur ne peut pas lire cette vidéo.
                        </video>
                    `;
                }


                if (exercice.photo_url) {

                    media += `
                        <img
                            src="${echapperHTML(exercice.photo_url)}"
                            alt="${echapperHTML(
                                exercice.nom || "Photo"
                            )}">
                    `;
                }


                const description =
                    exercice.description
                        ? `
                            <p>
                                ${echapperHTML(
                                    exercice.description
                                )}
                            </p>
                        `
                        : "";


                const serieInfo =
                    exercice.series ||
                    exercice.repetitions
                        ? `
                            <p>
                                🏋️
                                ${exercice.series || 0}
                                séries ×
                                ${exercice.repetitions || 0}
                                répétitions
                            </p>
                        `
                        : "";


                return `

                    <div class="exercise">

                        <h3>
                            ${echapperHTML(
                                exercice.nom ||
                                "Sans nom"
                            )}
                        </h3>

                        <div class="category-name">
                            ${echapperHTML(
                                exercice.categorie || ""
                            )}
                        </div>

                        ${serieInfo}

                        ${description}

                        ${media}

                        <div class="exercise-buttons">

                            <button
                                class="edit"
                                onclick="modifierExercice(${exercice.id})">
                                ✏️ Modifier
                            </button>

                            <button
                                class="delete"
                                onclick="supprimerExercice(${exercice.id})">
                                🗑️ Supprimer
                            </button>

                        </div>

                    </div>

                `;

            }
        ).join("");
}


/* =========================================
   RECHERCHE
========================================= */

function rechercher() {

    afficherExercices();

}


/* =========================================
   AJOUT / MODIFICATION
========================================= */

async function ajouterExercice() {

    const nom =
        document
            .getElementById("nom")
            .value
            .trim();


    const categorie =
        document.getElementById(
            "categorie"
        ).value;


    const description =
        document
            .getElementById("description")
            .value
            .trim();


    const series =
        parseInt(
            document.getElementById(
                "series"
            ).value
        ) || null;


    const repetitions =
        parseInt(
            document.getElementById(
                "repetitions"
            ).value
        ) || null;


    const videoFile =
        document.getElementById(
            "video"
        ).files[0];


    const photoFile =
        document.getElementById(
            "photo"
        ).files[0];


    const message =
        document.getElementById(
            "message"
        );


    if (!nom) {

        message.textContent =
            "⚠️ Indique le nom de l'exercice.";

        return;
    }


    message.textContent =
        "⏳ Enregistrement...";


    try {

        let videoUrl =
            exerciceEnModification
                ? exerciceEnModification.video_url
                : null;


        let photoUrl =
            exerciceEnModification
                ? exerciceEnModification.photo_url
                : null;


        /* =================================
           VIDEO
        ================================= */

        if (videoFile) {

            const nomFichier =
                Date.now() +
                "_" +
                nettoyerNomFichier(
                    videoFile.name
                );


            const chemin =
                "videos/" +
                nomFichier;


            const { error } =
                await supabaseClient
                    .storage
                    .from("medias")
                    .upload(
                        chemin,
                        videoFile
                    );


            if (error) {

                throw error;

            }


            const { data } =
                supabaseClient
                    .storage
                    .from("medias")
                    .getPublicUrl(
                        chemin
                    );


            videoUrl =
                data.publicUrl;
        }


        /* =================================
           PHOTO
        ================================= */

        if (photoFile) {

            const nomFichier =
                Date.now() +
                "_" +
                nettoyerNomFichier(
                    photoFile.name
                );


            const chemin =
                "photos/" +
                nomFichier;


            const { error } =
                await supabaseClient
                    .storage
                    .from("medias")
                    .upload(
                        chemin,
                        photoFile
                    );


            if (error) {

                throw error;

            }


            const { data } =
                supabaseClient
                    .storage
                    .from("medias")
                    .getPublicUrl(
                        chemin
                    );


            photoUrl =
                data.publicUrl;
        }


        /* =================================
           OBJET
        ================================= */

        const objet = {

            nom: nom,

            categorie: categorie,

            description: description,

            series: series,

            repetitions: repetitions,

            video_url: videoUrl,

            photo_url: photoUrl

        };


        /* =================================
           MODIFICATION
        ================================= */

        if (exerciceEnModification) {

            const { error } =
                await supabaseClient
                    .from("exercices")
                    .update(objet)
                    .eq(
                        "id",
                        exerciceEnModification.id
                    );


            if (error) {

                throw error;

            }


            message.textContent =
                "✅ Exercice modifié.";

        }


        /* =================================
           AJOUT
        ================================= */

        else {

            const { error } =
                await supabaseClient
                    .from("exercices")
                    .insert(objet);


            if (error) {

                throw error;

            }


            message.textContent =
                "✅ Exercice enregistré.";
        }


        reinitialiserFormulaire();


        await chargerExercices();


    } catch (error) {

        console.error(
            "Erreur :",
            error
        );


        message.textContent =
            "❌ Erreur : " +
            error.message;
    }
}


/* =========================================
   MODIFICATION
========================================= */

function modifierExercice(id) {

    const exercice =
        exercices.find(
            x => x.id === id
        );


    if (!exercice) {

        return;

    }


    exerciceEnModification =
        exercice;


    document.getElementById(
        "nom"
    ).value =
        exercice.nom || "";


    document.getElementById(
        "categorie"
    ).value =
        exercice.categorie ||
        "Pectoraux";


    document.getElementById(
        "series"
    ).value =
        exercice.series || "";


    document.getElementById(
        "repetitions"
    ).value =
        exercice.repetitions || "";


    document.getElementById(
        "description"
    ).value =
        exercice.description || "";


    document.getElementById(
        "titreFormulaire"
    ).textContent =
        "✏️ Modifier l'exercice";


    document.getElementById(
        "boutonPrincipal"
    ).textContent =
        "💾 ENREGISTRER LA MODIFICATION";


    document.getElementById(
        "bout
