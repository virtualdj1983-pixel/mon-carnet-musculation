<!DOCTYPE html><html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon Carnet Musculation</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}

body{
    margin:0;
    padding:12px;
    background:#0b0b0b;
    color:#fff;
    font-family:Arial,sans-serif;
}

.container{
    max-width:1000px;
    margin:auto;
}

header{
    text-align:center;
    padding:18px 8px;
}

header h1{
    margin:0;
    font-size:28px;
}

header p{
    color:#999;
    margin:8px 0 0;
}

.card{
    background:#181818;
    padding:16px;
    border-radius:16px;
    margin-top:14px;
    border:1px solid #292929;
}

h2{
    margin-top:0;
}

.categories{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
}

button{
    width:100%;
    padding:13px;
    border:0;
    border-radius:10px;
    font-weight:bold;
    color:#fff;
    cursor:pointer;
    font-size:14px;
}

.category{
    background:#292929;
}

.category:active{
    transform:scale(.98);
}

.save{
    background:#00c853;
    font-size:16px;
}

.update{
    background:#ff9800;
    margin-top:8px;
}

.cancel{
    background:#555;
    margin-top:8px;
}

.delete{
    background:#d50000;
    margin-top:10px;
}

input,select,textarea{
    width:100%;
    padding:13px;
    margin:6px 0 14px;
    background:#0e0e0e;
    color:#fff;
    border:1px solid #444;
    border-radius:9px;
    font-size:16px;
}

textarea{
    min-height:90px;
    resize:vertical;
}

label{
    display:block;
    font-weight:bold;
    margin-top:5px;
}

#message{
    text-align:center;
    margin-top:12px;
    padding:10px;
    border-radius:8px;
}

.exercise{
    background:#222;
    border-radius:14px;
    padding:15px;
    margin-top:12px;
    border:1px solid #333;
}

.exercise h3{
    margin:0 0 6px;
    font-size:20px;
}

.small{
    color:#aaa;
    font-size:14px;
}

.stats{
    background:#151515;
    border-radius:9px;
    padding:10px;
    margin-top:10px;
}

.exercise img,
.exercise video{
    width:100%;
    max-height:450px;
    object-fit:contain;
    background:#000;
    border-radius:10px;
    margin-top:10px;
}

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:10px;
}

.actions button{
    margin-top:0;
}

.empty{
    text-align:center;
    color:#999;
    padding:20px;
}

.hidden{
    display:none;
}

@media(min-width:700px){
    .categories{
        grid-template-columns:repeat(3,1fr);
    }
}
</style></head><body><div class="container"><header>
<h1>🏋️ Mon Carnet Musculation</h1>
<p>Mes exercices • vidéos • photos • notes</p>
</header><div class="card"><h2>📂 Mes catégories</h2><div class="categories"><button class="category" onclick="filtrer('Pectoraux')">💪 Pectoraux</button>
<button class="category" onclick="filtrer('Dos')">🔙 Dos</button>
<button class="category" onclick="filtrer('Épaules')">🏋️ Épaules</button>
<button class="category" onclick="filtrer('Biceps')">💪 Biceps</button>
<button class="category" onclick="filtrer('Triceps')">💪 Triceps</button>
<button class="category" onclick="filtrer('Jambes')">🦵 Jambes</button>
<button class="category" onclick="filtrer('Abdos')">🔥 Abdos</button>
<button class="category" onclick="filtrer('Photos')">📷 Photos</button>
<button class="category" onclick="filtrer('Notes')">📝 Notes</button>
<button class="category" onclick="chargerExercices()">🏠 Tout</button>

</div>
</div><div class="card"><h2 id="titreFormulaire">➕ Ajouter un exercice</h2><label>Catégorie</label>

<select id="categorie">
<option>Pectoraux</option>
<option>Dos</option>
<option>Épaules</option>
<option>Biceps</option>
<option>Triceps</option>
<option>Jambes</option>
<option>Abdos</option>
<option>Photos</option>
<option>Notes</option>
</select><label>Nom de l'exercice</label>

<input
id="nom"
type="text"
placeholder="Exemple : Développé couché"

«»

<label>Description</label>

<textarea
id="description"
placeholder="Technique, conseils, matériel..."
></textarea><label>Séries</label>

<input
id="series"
type="number"
placeholder="4"
min="0"

«»

<label>Répétitions</label>

<input
id="repetitions"
type="number"
placeholder="10"
min="0"

«»

<label>🎥 Vidéo</label>

<input
id="video"
type="file"
accept="video/*"

«»

<label>📷 Photo</label>

<input
id="photo"
type="file"
accept="image/*"

«»

<button
id="boutonPrincipal"
class="save"
onclick="ajouterExercice()"

«»

💾 ENREGISTRER
</button>

<button
id="boutonAnnuler"
class="cancel hidden"
onclick="annulerModification()"

«»

❌ ANNULER LA MODIFICATION
</button>

<div id="message"></div></div><div class="card"><h2>📚 Mes exercices</h2><div id="liste">
⏳ Chargement...
</div></div></div><script>

const SUPABASE_URL =
"https://cjtgjwepiotuhtfqwanw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_DXMY1V9ir7R_vwuFysSWwA_Pe-r5NNP";

const client =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let exerciceEnModification = null;


async function envoyerFichier(fichier){

if(!fichier){
return null;
}

const nomFichier =
Date.now() +
"_" +
Math.random().toString(36).substring(2) +
"_" +
fichier.name.replace(
/[^a-zA-Z0-9._-]/g,
"_"
);

const resultat =
await client.storage
.from("medias")
.upload(
nomFichier,
fichier
);

if(resultat.error){
throw resultat.error;
}

const publicUrl =
client.storage
.from("medias")
.getPublicUrl(
nomFichier
);

return publicUrl.data.publicUrl;
}


async function ajouterExercice(){

const message =
document.getElementById("message");

message.innerHTML =
"⏳ Préparation...";

try{

const categorie =
document.getElementById("categorie").value;

const nom =
document.getElementById("nom").value.trim();

const description =
document.getElementById("description").value.trim();

const series =
document.getElementById("series").value;

const repetitions =
document.getElementById("repetitions").value;

const video =
document.getElementById("video").files[0];

const photo =
document.getElementById("photo").files[0];

if(!nom){

message.innerHTML =
"⚠️ Indique le nom de l'exercice.";

return;
}

let videoUrl = null;
let photoUrl = null;

if(video){

message.innerHTML =
"🎥 Envoi de la vidéo...";

videoUrl =
await envoyerFichier(video);
}

if(photo){

message.innerHTML =
"📷 Envoi de la photo...";

photoUrl =
await envoyerFichier(photo);
}

message.innerHTML =
"☁️ Enregistrement...";

const resultat =
await client
.from("exercices")
.insert({

nom:nom,

categorie:categorie,

description:
description || null,

series:
series
? Number(series)
: null,

repetitions:
repetitions
? Number(repetitions)
: null,

video_url:
videoUrl,

photo_url:
photoUrl

});

if(resultat.error){
throw resultat.error;
}

message.innerHTML =
"✅ EXERCICE ENREGISTRÉ !";

viderFormulaire();

chargerExercices();

}

catch(erreur){

message.innerHTML =
"❌ ERREUR : " +
erreur.message;

}

}


async function chargerExercices(){

const liste =
document.getElementById("liste");

liste.innerHTML =
"⏳ Chargement...";

const resultat =
await client
.from("exercices")
.select("*")
.order(
"id",
{
ascending:false
}
);

if(resultat.error){

liste.innerHTML =
"❌ " +
resultat.error.message;

return;
}

if(!resultat.data.length){

liste.innerHTML =
"<div class='empty'>Aucun exercice enregistré.</div>";

return;
}

afficher(resultat.data);

}


function afficher(exercices){

const liste =
document.getElementById("liste");

liste.innerHTML = "";

if(!exercices.length){

liste.innerHTML =
"<div class='empty'>Aucun exercice dans cette catégorie.</div>";

return;
}

exercices.forEach(
function(exercice){

const bloc =
document.createElement("div");

bloc.className =
"exercise";

let html = "";

html +=
"<h3>🏋️ " +
securiser(exercice.nom) +
"</h3>";

html +=
"<div class='small'>📂 " +
securiser(exercice.categorie || "") +
"</div>";

if(exercice.description){

html +=
"<p>" +
securiser(exercice.description) +
"</p>";

}

if(
exercice.series !== null ||
exercice.repetitions !== null
){

html +=
"<div class='stats'>🔢 <b>" +
(exercice.series ?? "-") +
"</b> séries × <b>" +
(exercice.repetitions ?? "-") +
"</b> répétitions</div>";

}

if(exercice.video_url){

html +=
"<video controls playsinline>" +
"<source src='" +
securiser(exercice.video_url) +
"'>" +
"Votre navigateur ne peut pas lire cette vidéo." +
"</video>";

}

if(exercice.photo_url){

html +=
"<img src='" +
securiser(exercice.photo_url) +
"' alt='Photo de l'exercice'>";

}

html +=
"<div class='actions'>";

html +=
"<button class='update' onclick='modifierExercice(" +
exercice.id +
")'>✏️ Modifier</button>";

html +=
"<button class='delete' onclick='supprimer(" +
exercice.id +
")'>🗑️ Supprimer</button>";

html +=
"</div>";

bloc.innerHTML =
html;

liste.appendChild(bloc);

}
);

}


async function modifierExercice(id){

const resultat =
await client
.from("exercices")
.select("*")
.eq("id",id)
.single();

if(resultat.error){

alert(
"Erreur : " +
resultat.error.message
);

return;
}

const exercice =
resultat.data;

exerciceEnModification =
exercice.id;

document.getElementById("categorie").value =
exercice.categorie || "Pectoraux";

document.getElementById("nom").value =
exercice.nom || "";

document.getElementById("description").value =
exercice.description || "";

document.getElementById("series").value =
exercice.series ?? "";

document.getElementById("repetitions").value =
exercice.repetitions ?? "";

document.getElementById("titreFormulaire").innerHTML =
"✏️ Modifier l'exercice";

document.getElementById("boutonPrincipal").innerHTML =
"💾 ENREGISTRER LES MODIFICATIONS";

document.getElementById("boutonPrincipal").onclick =
enregistrerModification;

document.getElementById("boutonAnnuler").classList.remove("hidden");

window.scrollTo({
top:0,
behavior:"smooth"
});

}


async function enregistrerModification(){

if(!exerciceEnModification){
return;
}

const message =
document.getElementById("message");

message.innerHTML =
"⏳ Modification...";

try{

const categorie =
document.getElementById("categorie").value;

const nom =
document.getElementById("nom").value.trim();

const description =
document.getElementById("description").value.trim();

const series =
document.getElementById("series").value;

const repetitions =
document.getElementById("repetitions").value;

if(!nom){

message.innerHTML =
"⚠️ Indique le nom de l'exercice.";

return;
}

const resultat =
await client
.from("exercices")
.update({

categorie:categorie,

nom:nom,

description:
description || null,

series:
series
? Number(series)
: null,

repetitions:
repetitions
? Number(repetitions)
: null

})
.eq(
"id",
exerciceEnModification
);

if(resultat.error){
throw resultat.error;
}

message.innerHTML =
"✅ MODIFICATION ENREGISTRÉE !";

annulerModification();

chargerExercices();

}

catch(erreur){

message.innerHTML =
"❌ ERREUR : " +
erreur.message;

}

}


function annulerModification(){

exerciceEnModification = null;

viderFormulaire();

document.getElementById("titreFormulaire").innerHTML =
"➕ Ajouter un exercice";

document.getElementById("boutonPrincipal").innerHTML =
"💾 ENREGISTRER";

document.getElementById("boutonPrincipal").onclick =
ajouterExercice;

document.getElementById("boutonAnnuler").classList.add("hidden");

}


function viderFormulaire(){

document.getElementById("nom").value = "";

document.getElementById("description").value = "";

document.getElementById("series").value = "";

document.getElementById("repetitions").value = "";

document.getElementById("video").value = "";

document.getElementById("photo").value = "";

}


async function filtrer(categorie){

const liste =
document.getElementById("liste");

liste.innerHTML =
"⏳ Chargement...";

const resultat =
await client
.from("exercices")
.select("*")
.eq("categorie",categorie)
.order(
"id",
{
ascending:false
}
);

if(resultat.error){

liste.innerHTML =
"❌ " +
resultat.error.message;

return;
}

afficher(resultat.data || []);

}


async function supprimer(id){

if(!confirm("Supprimer cet exercice ?")){
return;
}

const resultat =
await client
.from("exercices")
.delete()
.eq("id",id);

if(resultat.error){

alert(
"Erreur : " +
resultat.error.message
);

return;
}

chargerExercices();

}


function securiser(texte){

return String(texte)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


chargerExercices();

</script></body>
    </html>
