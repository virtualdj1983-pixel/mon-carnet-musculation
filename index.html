<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon Carnet Musculation</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
    margin:0;
    padding:15px;
    background:#101010;
    color:white;
    font-family:Arial,sans-serif;
}

.container{
    max-width:1000px;
    margin:auto;
}

header{
    text-align:center;
    padding:15px;
}

header h1{
    margin:0;
}

header p{
    color:#aaa;
}

.card{
    background:#1d1d1d;
    padding:18px;
    border-radius:15px;
    margin-top:15px;
}

.categories{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
}

input,select,textarea{
    width:100%;
    box-sizing:border-box;
    padding:12px;
    margin:7px 0 14px;
    background:#111;
    color:white;
    border:1px solid #555;
    border-radius:8px;
}

textarea{
    min-height:90px;
}

button{
    width:100%;
    padding:13px;
    border:0;
    border-radius:9px;
    font-weight:bold;
    color:white;
    cursor:pointer;
}

.category{
    background:#292929;
}

.save{
    background:#00c853;
}

.delete{
    background:#d50000;
    margin-top:10px;
}

#message{
    text-align:center;
    margin-top:12px;
    padding:10px;
}

.exercise{
    background:#242424;
    border-radius:12px;
    padding:15px;
    margin-top:12px;
}

.exercise img,
.exercise video{
    width:100%;
    max-height:450px;
    object-fit:contain;
    background:#000;
    border-radius:10px;
    margin-top:10px;
}

.exercise h3{
    margin-top:0;
}

.small{
    color:#aaa;
}

@media(min-width:700px){
    .categories{
        grid-template-columns:repeat(3,1fr);
    }
}
</style>
</head>

<body>

<div class="container">

<header>
<h1>🏋️ Mon Carnet Musculation</h1>
<p>Mes exercices, vidéos, photos et notes</p>
</header>


<div class="card">

<h2>📂 Catégories</h2>

<div class="categories">

<button class="category" onclick="filtrer('Pectoraux')">
💪 Pectoraux
</button>

<button class="category" onclick="filtrer('Dos')">
🔙 Dos
</button>

<button class="category" onclick="filtrer('Épaules')">
🏋️ Épaules
</button>

<button class="category" onclick="filtrer('Biceps')">
💪 Biceps
</button>

<button class="category" onclick="filtrer('Triceps')">
💪 Triceps
</button>

<button class="category" onclick="filtrer('Jambes')">
🦵 Jambes
</button>

<button class="category" onclick="filtrer('Abdos')">
🔥 Abdos
</button>

<button class="category" onclick="filtrer('Photos')">
📷 Photos
</button>

<button class="category" onclick="filtrer('Notes')">
📝 Notes
</button>

<button class="category" onclick="chargerExercices()">
🏠 Tout
</button>

</div>

</div>


<div class="card">

<h2>➕ Ajouter un exercice</h2>


<label>Catégorie</label>

<select id="categorie">

<option>Pectoraux</option>
<option>Dos</option>
<option>Épaules</option>
<option>Biceps</option>
<option>Triceps</option>
<option>Jambes</option>
<option>Abdos</option>
<option>Photos</option>
<option>Notes</option>

</select>


<label>Nom de l'exercice</label>

<input
id="nom"
type="text"
placeholder="Exemple : Développé couché"
>


<label>Description</label>

<textarea
id="description"
placeholder="Technique, conseils, matériel..."
></textarea>


<label>Séries</label>

<input
id="series"
type="number"
placeholder="4"
>


<label>Répétitions</label>

<input
id="repetitions"
type="number"
placeholder="10"
>


<label>🎥 Vidéo</label>

<input
id="video"
type="file"
accept="video/*"
>


<label>📷 Photo</label>

<input
id="photo"
type="file"
accept="image/*"
>


<button
class="save"
onclick="ajouterExercice()"
>
💾 ENREGISTRER
</button>


<div id="message"></div>

</div>


<div class="card">

<h2>📚 Mes exercices</h2>

<div id="liste">
Chargement...
</div>

</div>

</div>


<script>

const SUPABASE_URL =
"https://cjtgjwepiotuhtfqwanw.supabase.co";


const SUPABASE_KEY =
"sb_publishable_DXMY1V9ir7R_vwuFysSWwA_Pe-r5NNP";


const client =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


async function envoyerFichier(fichier){

if(!fichier){

return null;

}


const nomFichier =
Date.now() +
"_" +
Math.random()
.toString(36)
.substring(2) +
"_" +
fichier.name.replace(
/[^a-zA-Z0-9._-]/g,
"_"
);


const resultat =
await client.storage
.from("medias")
.upload(
nomFichier,
fichier
);


if(resultat.error){

throw resultat.error;

}


const publicUrl =
client.storage
.from("medias")
.getPublicUrl(
nomFichier
);


return publicUrl.data.publicUrl;

}


async function ajouterExercice(){

const message =
document.getElementById(
"message"
);


message.innerHTML =
"⏳ Préparation...";


try{

const categorie =
document.getElementById(
"categorie"
).value;


const nom =
document.getElementById(
"nom"
).value.trim();


const description =
document.getElementById(
"description"
).value.trim();


const series =
document.getElementById(
"series"
).value;


const repetitions =
document.getElementById(
"repetitions"
).value;


const video =
document.getElementById(
"video"
).files[0];


const photo =
document.getElementById(
"photo"
).files[0];


if(!nom){

message.innerHTML =
"⚠️ Indique le nom de l'exercice.";

return;

}


let videoUrl = null;

let photoUrl = null;


if(video){

message.innerHTML =
"🎥 Envoi de la vidéo...";

videoUrl =
await envoyerFichier(video);

}


if(photo){

message.innerHTML =
"📷 Envoi de la photo...";

photoUrl =
await envoyerFichier(photo);

}


message.innerHTML =
"☁️ Enregistrement dans le carnet...";


const resultat =
await client
.from("exercices")
.insert({

nom:nom,

categorie:categorie,

description:
description || null,

series:
series
? Number(series)
: null,

repetitions:
repetitions
? Number(repetitions)
: null,

video_url:
videoUrl,

photo_url:
photoUrl

});


if(resultat.error){

throw resultat.error;

}


message.innerHTML =
"✅ EXERCICE ENREGISTRÉ !";


document.getElementById(
"nom"
).value = "";


document.getElementById(
"description"
).value = "";


document.getElementById(
"series"
).value = "";


document.getElementById(
"repetitions"
).value = "";


document.getElementById(
"video"
).value = "";


document.getElementById(
"photo"
).value = "";


chargerExercices();

}

catch(erreur){

message.innerHTML =
"❌ ERREUR : " +
erreur.message;

}

}


async function chargerExercices(){

const liste =
document.getElementById(
"liste"
);


liste.innerHTML =
"⏳ Chargement...";


const resultat =
await client
.from("exercices")
.select("*")
.order(
"id",
{
ascending:false
}
);


if(resultat.error){

liste.innerHTML =
"❌ " +
resultat.error.message;

return;

}


if(!resultat.data.length){

liste.innerHTML =
"Aucun exercice enregistré.";

return;

}


afficher(
resultat.data
);

}


function afficher(exercices){

const liste =
document.getElementById(
"liste"
);


liste.innerHTML = "";


exercices.forEach(
function(exercice){

const bloc =
document.createElement(
"div"
);


bloc.className =
"exercise";


let html = "";


html +=
"<h3>🏋️ " +
securiser(
exercice.nom
) +
"</h3>";


html +=
"<div class='small'>📂 " +
securiser(
exercice.categorie || ""
) +
"</div>";


if(exercice.description){

html +=
"<p>" +
securiser(
exercice.description
) +
"</p>";

}


if(
exercice.series ||
exercice.repetitions
){

html +=
"<p>🔢 " +
(
exercice.series || "-"
) +
" séries × " +
(
exercice.repetitions || "-"
) +
" répétitions</p>";

}


if(exercice.video_url){

html +=
"<video controls>" +
"<source src='" +
exercice.video_url +
"'>" +
"</video>";

}


if(exercice.photo_url){

html +=
"<img src='" +
exercice.photo_url +
"' alt='Photo de l'exercice'>";

}


html +=
"<button " +
"class='delete' " +
"onclick='supprimer(" +
exercice.id +
")'>" +
"🗑️ Supprimer" +
"</button>";


bloc.innerHTML =
html;


liste.appendChild(
bloc
);

}
);

}


async function filtrer(categorie){

const resultat =
await client
.from("exercices")
.select("*")
.eq(
"categorie",
categorie
)
.order(
"id",
{
ascending:false
}
);


if(resultat.error){

document.getElementById(
"liste"
).innerHTML =
"❌ " +
resultat.error.message;

return;

}


afficher(
resultat.data || []
);

}


async function supprimer(id){

if(
!confirm(
"Supprimer cet exercice ?"
)
){

return;

}


const resultat =
await client
.from("exercices")
.delete()
.eq(
"id",
id
);


if(resultat.error){

alert(
"Erreur : " +
resultat.error.message
);

return;

}


chargerExercices();

}


function securiser(texte){

return String(
texte
)
.replace(
/&/g,
"&amp;"
)
.replace(
/</g,
"&lt;"
)
.replace(
/>/g,
"&gt;"
)
.replace(
/"/g,
"&quot;"
)
.replace(
/'/g,
"&#039;"
);

}


chargerExercices();

</script>

</body>
    </html>
