/* ============================================================
   CONFIGURATION SUPABASE
   ============================================================ */

const SUPABASE_URL =
    "https://cjtgjwepiotuhtfqwanw.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_DXMY1V9ir7R_vwuFysSWwA_Pe-r5NNP";

const TABLE_URL =
    SUPABASE_URL + "/rest/v1/exercices";

const STORAGE_URL =
    SUPABASE_URL + "/storage/v1/object/medias";


/* ============================================================
   VARIABLES
   ============================================================ */

let exercices = [];

let filtreActuel = "TOUS";

let modePhotos = false;


/* ============================================================
   HEADERS SUPABASE
   ============================================================ */

function headersSupabase() {

    return {
        "apikey": SUPABASE_KEY,
        "Content-Type": "application/json"
    };

}


/* ============================================================
   FETCH AVEC TIMEOUT
   ============================================================ */

async function fetchAvecTimeout(
    url,
    options = {},
    timeout = 15000
) {

    const controller =
        new AbortController();

    const timer =
        setTimeout(
            function() {
                controller.abort();
            },
            timeout
        );

    try {

        return await fetch(
            url,
            {
                ...options,
                signal:
                    controller.signal
            }
        );

    } finally {

        clearTimeout(timer);

    }

}


/* ============================================================
   MESSAGE
   ============================================================ */

function message(texte) {

    const zone =
        document.getElementById("message");

    if (zone) {
        zone.innerHTML = texte;
    }

}


/* ============================================================
   ECHAPPER HTML
   ============================================================ */

function echapperHTML(texte) {

    if (
        texte === null ||
        texte === undefined
    ) {
        return "";
    }

    return String(texte)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* ============================================================
   EXTRAIRE POIDS / CHARGE
   ============================================================ */

function extraireDonneesMusculation(
    description
) {

    const texte =
        String(description || "");

    const poidsMatch =
        texte.match(
            /\[POIDS:([0-9]+(?:[.,][0-9]+)?)\]/i
        );

    const chargeMatch =
        texte.match(
            /\[CHARGE:(Trop léger|Correct|Trop lourd)\]/i
        );

    let poids = "";

    if (poidsMatch) {

        poids =
            poidsMatch[1]
                .replace(",", ".");

    }

    const charge =
        chargeMatch
            ? chargeMatch[1]
            : "";

    let notePropre =
        texte
            .replace(
                /\[POIDS:[0-9]+(?:[.,][0-9]+)?\]\s*/gi,
                ""
            )
            .replace(
                /\[CHARGE:(?:Trop léger|Correct|Trop lourd)\]\s*/gi,
                ""
            )
            .trim();

    return {
        poids: poids,
        charge: charge,
        description: notePropre
    };

}


/* ============================================================
   CONSTRUIRE DESCRIPTION
   ============================================================ */

function construireDescription(
    description,
    poids,
    charge
) {

    let texte =
        String(description || "")
            .trim();

    texte =
        texte
            .replace(
                /\[POIDS:[0-9]+(?:[.,][0-9]+)?\]\s*/gi,
                ""
            )
            .replace(
                /\[CHARGE:(?:Trop léger|Correct|Trop lourd)\]\s*/gi,
                ""
            )
            .trim();

    const informations = [];

    if (
        poids !== null &&
        poids !== undefined &&
        String(poids).trim() !== ""
    ) {

        informations.push(
            "[[POIDS:" +
            String(poids).replace(",", ".") +
            "]]"
        );

    }

    if (
        charge === "Trop léger" ||
        charge === "Correct" ||
        charge === "Trop lourd"
    ) {

        informations.push(
            "[[CHARGE:" +
            charge +
            "]]"
        );

    }

    if (informations.length > 0) {

        return (
            informations.join(" ") +
            (
                texte
                    ? "\n" + texte
                    : ""
            )
        );

    }

    return texte;

}


/* ============================================================
   CLASSE CHARGE
   ============================================================ */

function classeCharge(charge) {

    if (charge === "Trop léger") {
        return "charge-leger";
    }

    if (charge === "Correct") {
        return "charge-correct";
    }

    if (charge === "Trop lourd") {
        return "charge-lourd";
    }

    return "";

}

    const connexion =
        document.getElementById("connexion");

    const zone =
        document.getElementById("listeExercices");

    connexion.style.display = "block";

    connexion.className = "loading";

    connexion.innerHTML =
        "🔄 Connexion à Supabase...";

    try {

        const response =
            await fetchAvecTimeout(
                TABLE_URL +
                "?select=*&order=id.desc",
                {
                    method: "GET",
                    headers: headersSupabase(),
                    cache: "no-store"
                },
                15000
            );

        const texte =
            await response.text();

        if (!response.ok) {

            connexion.className =
                "error-box";

            connexion.innerHTML =
                "<strong>❌ ERREUR SUPABASE</strong><br><br>" +
                "Code HTTP : <strong>" +
                response.status +
                "</strong><br><br>" +
                "<strong>Réponse :</strong><br>" +
                echapperHTML(texte) +
                "<br><br>" +
                "Tes exercices ne sont PAS supprimés.";

            zone.innerHTML = "";

            return;

        }

        const donnees =
            JSON.parse(texte);

        if (!Array.isArray(donnees)) {

            throw new Error(
                "Supabase n'a pas renvoyé une liste d'exercices."
            );

        }

        exercices =
            donnees;

        connexion.className =
            "message";

        connexion.innerHTML =
            "🟢 Connexion réussie — " +
            exercices.length +
            " exercice(s)";

        mettreAJourStats();

        afficherExercices();

        afficherGalerie();

        afficherNotes();

    } catch (erreur) {

        console.error(
            "ERREUR SUPABASE :",
            erreur
        );

        connexion.className =
            "error-box";

        connexion.innerHTML =
            "<strong>❌ Impossible de contacter Supabase.</strong><br><br>" +
            echapperHTML(erreur.message) +
            "<br><br>" +
            "Tes données ne sont PAS supprimées.";

        zone.innerHTML = "";

    }

}

/* ============================================================
   OBTENIR LA LISTE SELON LE FILTRE
   ============================================================ */

function obtenirListeFiltree() {

    let liste =
        [...exercices];


    if (modePhotos) {

        liste =
            liste.filter(
                e => e.photo_url
            );

        return liste;

    }


    if (
        filtreActuel !== "TOUS"
    ) {

        liste =
            liste.filter(
                function(e) {

                    return String(
                        e.categorie || ""
                    )
                    .trim()
                    .toLowerCase() ===
                    String(
                        filtreActuel
                    )
                    .trim()
                    .toLowerCase();

                }
            );

    }


    return liste;

}


/* ============================================================
   AFFICHER EXERCICES
   ============================================================ */

function afficherExercices() {

    const zone =
        document.getElementById(
            "listeExercices"
        );

    const recherche =
        document.getElementById(
            "recherche"
        )
        .value
        .toLowerCase()
        .trim();


    let liste =
        obtenirListeFiltree();


    if (recherche) {

        liste =
            liste.filter(
                function(e) {

                    const nom =
                        String(
                            e.nom || ""
                        ).toLowerCase();

                    const description =
                        String(
                            e.description || ""
                        ).toLowerCase();

                    const categorie =
                        String(
                            e.categorie || ""
                        ).toLowerCase();

                    return (
                        nom.includes(recherche) ||
                        description.includes(recherche) ||
                        categorie.includes(recherche)
                    );

                }
            );

    }


    if (liste.length === 0) {

        zone.innerHTML =
            '<div class="empty">Aucun exercice dans cette sélection.</div>';

        return;

    }


    zone.innerHTML =
        liste.map(
            function(e) {

                const nom =
                    echapperHTML(e.nom);

                const categorie =
                    echapperHTML(e.categorie);

                const donnees =
                    extraireDonneesMusculation(
                        e.description
                    );

                const description =
                    echapperHTML(
                        donnees.description
                    );


                let chargeAffichage =
                    "Non renseignée";


                if (
                    donnees.charge ===
                    "Trop léger"
                ) {

                    chargeAffichage =
                        "🟡 Trop léger";

                }


                if (
                    donnees.charge ===
                    "Correct"
                ) {

                    chargeAffichage =
                        "🟢 Correct";

                }


                if (
                    donnees.charge ===
                    "Trop lourd"
                ) {

                    chargeAffichage =
                        "🔴 Trop lourd";

                }


                const classe =
                    classeCharge(
                        donnees.charge
                    );


                let html = `

                    <div class="card">

                        <h3>
                            ${nom}
                        </h3>

                        <div class="exercise-category">
                            🏷️ ${categorie}
                        </div>

                        <div class="info">
                            💪 ${e.series || 0}
                            séries ×
                            ${e.repetitions || 0}
                            répétitions
                        </div>

                `;


                if (
                    donnees.poids ||
                    donnees.charge
                ) {

                    html += `

                        <div class="performance">

                            <div class="performance-box">

                                <span class="performance-label">
                                    ⚖️ Poids utilisé
                                </span>

                                <span class="performance-value weight-value">
                                    ${
                                        donnees.poids
                                            ? echapperHTML(
                                                donnees.poids
                                            ) + " kg"
                                            : "Non renseigné"
                                    }
                                </span>

                            </div>


                            <div class="performance-box">

                                <span class="performance-label">
                                    🎯 Charge
                                </span>

                                <span class="performance-value ${classe}">
                                    ${chargeAffichage}
                                </span>

                            </div>

                        </div>

                    `;

                }


                if (description) {

                    html += `

                        <p class="info">
                            📝 ${description}
                        </p>

                    `;

                }


                if (e.video_url) {

                    html += `

                        <video
                            class="video"
                            controls
                            preload="metadata"
                            src="${echapperHTML(
                                e.video_url
                            )}">
                        </video>

                    `;

                }


                if (e.photo_url) {

                    html += `

                        <img
                            class="photo"
                            src="${echapperHTML(
                                e.photo_url
                            )}"
                            alt="${nom}"
                            loading="lazy">

                    `;

                }


                html += `

                        <div class="actions">

                            <button
                                class="edit"
                                onclick="modifierExercice(${Number(e.id)})">
                                ✏️ Modifier
                            </button>

                            <button
                                class="delete"
                                onclick="supprimerExercice(${Number(e.id)})">
                                🗑️ Supprimer
                            </button>

                        </div>

                    </div>

                `;


                return html;

            }
        ).join("");

}

/* ============================================================
   UPLOAD
   ============================================================ */

async function envoyerFichier(
    fichier,
    prefixe
) {

    if (!fichier) {
        return null;
    }


    const extension =
        fichier.name.includes(".")
            ? fichier.name.substring(
                fichier.name.lastIndexOf(".")
            )
            : "";


    const nomFichier =
        prefixe +
        "_" +
        Date.now() +
        "_" +
        Math.random()
            .toString(36)
            .substring(2, 9) +
        extension;


    const url =
        STORAGE_URL +
        "/" +
        encodeURIComponent(
            nomFichier
        );


    const response =
        await fetchAvecTimeout(
            url,
            {
                method: "POST",

                headers: {
                    "apikey":
                        SUPABASE_KEY,

                    "x-upsert":
                        "false",

                    "Content-Type":
                        fichier.type ||
                        "application/octet-stream"
                },

                body: fichier

            },
            60000
        );


    const texte =
        await response.text();


    if (!response.ok) {

        throw new Error(
            "Erreur upload : " +
            texte
        );

    }


    return (
        SUPABASE_URL +
        "/storage/v1/object/public/medias/" +
        nomFichier
    );

}


/* ============================================================
   SAUVEGARDER
   ============================================================ */

async function sauvegarderExercice() {

    const id =
        document.getElementById(
            "exerciceId"
        ).value;


    const nom =
        document.getElementById(
            "nom"
        ).value.trim();


    const categorie =
        document.getElementById(
            "categorie"
        ).value;


    const series =
        parseInt(
            document.getElementById(
                "series"
            ).value
        ) || 0;


    const repetitions =
        parseInt(
            document.getElementById(
                "repetitions"
            ).value
        ) || 0;


    const poids =
        document.getElementById(
            "poids"
        ).value.trim();


    const charge =
        document.getElementById(
            "charge"
        ).value;


    const descriptionTexte =
        document.getElementById(
            "description"
        ).value.trim();


    const description =
        construireDescription(
            descriptionTexte,
            poids,
            charge
        );


    const videoFile =
        document.getElementById(
            "video"
        ).files[0];


    const photoFile =
        document.getElementById(
            "photo"
        ).files[0];


    if (!nom) {

        alert(
            "Entre le nom de l'exercice."
        );

        return;

    }


    try {

        message(
            "⏳ Enregistrement en cours..."
        );


        let videoUrl = null;

        let photoUrl = null;


        if (videoFile) {

            message(
                "⏳ Envoi de la vidéo..."
            );

            videoUrl =
                await envoyerFichier(
                    videoFile,
                    "video"
                );

        }


        if (photoFile) {

            message(
                "⏳ Envoi de la photo..."
            );

            photoUrl =
                await envoyerFichier(
                    photoFile,
                    "photo"
                );

        }


        if (id) {

            const ancien =
                exercices.find(
                    e =>
                        String(e.id) ===
                        String(id)
                );


            const donnees = {

                nom: nom,

                categorie: categorie,

                series: series,

                repetitions: repetitions,

                description: description

            };


            if (videoUrl) {

                donnees.video_url =
                    videoUrl;

            } else if (ancien) {

                donnees.video_url =
                    ancien.video_url ||
                    null;

            }


            if (photoUrl) {

                donnees.photo_url =
                    photoUrl;

            } else if (ancien) {

                donnees.photo_url =
                    ancien.photo_url ||
                    null;

            }


            const response =
                await fetchAvecTimeout(
                    TABLE_URL +
                    "?id=eq." +
                    encodeURIComponent(id),
                    {
                        method: "PATCH",

                        headers: {
                            ...headersSupabase(),

                            "Prefer":
                                "return=representation"
                        },

                        body:
                            JSON.stringify(
                                donnees
                            )
                    },
                    15000
                );


            const texte =
                await response.text();


            if (!response.ok) {

                throw new Error(
                    texte
                );

            }


            message(
                "✅ Exercice modifié avec succès."
            );


        } else {

            const donnees = {

                nom: nom,

                categorie: categorie,

                series: series,

                repetitions: repetitions,

                description: description,

                video_url: videoUrl,

                photo_url: photoUrl

            };


            const response =
                await fetchAvecTimeout(
                    TABLE_URL,
                    {
                        method: "POST",

                        headers: {
                            ...headersSupabase(),

                            "Prefer":
                                "return=representation"
                        },

                        body:
                            JSON.stringify(
                                donnees
                            )
                    },
                    15000
                );


            const texte =
                await response.text();


            if (!response.ok) {

                throw new Error(
                    texte
                );

            }


            message(
                "✅ Exercice enregistré avec succès."
            );

        }


        viderFormulaire();

        await chargerExercices();


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });


    } catch (erreur) {

        console.error(
            "Erreur sauvegarde :",
            erreur
        );


        message(
            "❌ Erreur : " +
            echapperHTML(
                erreur.message
            )
        );

    }

}


/* ============================================================
   MODIFIER
   ============================================================ */

function modifierExercice(id) {

    const exercice =
        exercices.find(
            e =>
                Number(e.id) ===
                Number(id)
        );


    if (!exercice) {

        alert(
            "Exercice introuvable."
        );

        return;

    }


    const donnees =
        extraireDonneesMusculation(
            exercice.description
        );


    document.getElementById(
        "exerciceId"
    ).value =
        exercice.id;


    document.getElementById(
        "nom"
    ).value =
        exercice.nom || "";


    document.getElementById(
        "categorie"
    ).value =
        exercice.categorie ||
        "Pectoraux";


    document.getElementById(
        "series"
    ).value =
        exercice.series || 4;


    document.getElementById(
        "repetitions"
    ).value =
        exercice.repetitions || 10;


    document.getElementById(
        "poids"
    ).value =
        donnees.poids || "";


    document.getElementById(
        "charge"
    ).value =
        donnees.charge || "";


    document.getElementById(
        "description"
    ).value =
        donnees.description || "";


    document.getElementById(
        "titreFormulaire"
    ).textContent =
        "✏️ Modifier l'exercice";


    document.querySelector(
        ".form-icon"
    ).textContent =
        "✏️";


    document.getElementById(
        "btnAnnuler"
    ).style.display =
        "block";


    document.getElementById(
        "sectionFormulaire"
    ).scrollIntoView({
        behavior: "smooth"
    });

}

/* ============================================================
   SUPPRIMER
   ============================================================ */

async function supprimerExercice(id) {

    const exercice =
        exercices.find(
            e =>
                Number(e.id) ===
                Number(id)
        );


    if (!exercice) {
        return;
    }


    const confirmation =
        confirm(
            "Supprimer « " +
            exercice.nom +
            " » ?"
        );


    if (!confirmation) {
        return;
    }


    try {

        message(
            "⏳ Suppression..."
        );


        const response =
            await fetchAvecTimeout(
                TABLE_URL +
                "?id=eq." +
                encodeURIComponent(id),
                {
                    method: "DELETE",
                    headers:
                        headersSupabase()
                },
                15000
            );


        const texte =
            await response.text();


        if (!response.ok) {

            throw new Error(
                texte
            );

        }


        message(
            "✅ Exercice supprimé."
        );


        await chargerExercices();


    } catch (erreur) {

        console.error(
            erreur
        );


        message(
            "❌ Erreur de suppression : " +
            echapperHTML(
                erreur.message
            )
        );

    }

}


/* ============================================================
   GALERIE — FILTRÉE PAR CATÉGORIE
   ============================================================ */

function afficherGalerie() {

    const galerie =
        document.getElementById(
            "galerie"
        );


    let liste =
        obtenirListeFiltree();


    const photos =
        liste.filter(
            e => e.photo_url
        );


    if (photos.length === 0) {

        if (
            filtreActuel !== "TOUS" &&
            !modePhotos
        ) {

            galerie.innerHTML =
                '<div class="empty">📷 Aucune photo pour ' +
                echapperHTML(filtreActuel) +
                '.</div>';

        } else {

            galerie.innerHTML =
                '<div class="empty">📷 Aucune photo pour le moment</div>';

        }

        return;

    }


    galerie.innerHTML =
        photos.map(
            function(e) {

                const url =
                    echapperHTML(
                        e.photo_url
                    );


                return `

                    <img
                        src="${url}"
                        alt="${echapperHTML(e.nom)}"
                        title="${echapperHTML(e.nom)}"
                        loading="lazy"
                        onclick="window.open('${url}', '_blank')">

                `;

            }
        ).join("");

}


/* ============================================================
   NOTES — FILTRÉES PAR CATÉGORIE
   ============================================================ */

    const zone =
        document.getElementById(
            "notes"
        );


    let liste =
        obtenirListeFiltree();


    const notes =
        liste
            .map(
                function(e) {

                    const donnees =
                        extraireDonneesMusculation(
                            e.description
                        );


                    return {
                        exercice: e,
                        note: donnees.description
                    };

                }
            )
            .filter(
                function(x) {

                        x.note &&

                }
            );


    if (notes.length === 0) {

        if (
            filtreActuel !== "TOUS" &&
            !modePhotos
        ) {

            zone.innerHTML =
                '<div class="empty">📝 Aucune note pour ' +
                echapperHTML(filtreActuel) +
                '.</div>';

        } else {

            zone.innerHTML =
                '<div class="empty">📝 Aucune note pour le moment</div>';

        }

        return;

    }


    zone.innerHTML =
        notes.map(
            function(x) {

                return `

                    <div class="card">

                        <h3>
                            ${echapperHTML(
                                x.exercice.nom
                            )}
                        </h3>

                        <div class="exercise-category">
                            🏷️ ${echapperHTML(

                            )}

                        <div class="info">
                            📝 ${echapperHTML(
                                x.note
                            )}

        ).join("");
