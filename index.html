    Mon Carnet Musculation
</footer><script>

/* ============================================================
   CONFIGURATION SUPABASE
   ============================================================ */

const SUPABASE_URL =
"https://cjtgjwepiotuhtfqwanw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_DXMY1V9ir7R_vwuFysSWwA_Pe-r5NNP";

const TABLE_URL =
SUPABASE_URL + "/rest/v1/exercices";

const STORAGE_URL =
SUPABASE_URL + "/storage/v1/object/medias";


/* ============================================================
   VARIABLES
   ============================================================ */

let exercices = [];

let filtreActuel = "TOUS";

let modePhotos = false;


/* ============================================================
   HEADERS SUPABASE
   ============================================================ */

function headersSupabase() {

    /*
     * IMPORTANT :
     * La nouvelle clé sb_publishable_... n'est pas
     * une ancienne clé JWT anon.
     *
     * Elle doit être envoyée avec "apikey".
     * On ne la met donc PAS dans Authorization: Bearer.
     */

    return {
        "apikey": SUPABASE_KEY,
        "Content-Type": "application/json"
    };

}


/* ============================================================
   REQUETE AVEC TIMEOUT
   ============================================================ */

async function fetchAvecTimeout(url, options = {}, timeout = 15000) {

    const controller =
        new AbortController();

    const timer =
        setTimeout(
            () => controller.abort(),
            timeout
        );

    try {

        return await fetch(
            url,
            {
                ...options,
                signal: controller.signal
            }
        );

    } finally {

        clearTimeout(timer);

    }

}


/* ============================================================
   MESSAGE
   ============================================================ */

function message(texte) {

    document.getElementById("message").innerHTML =
        texte;

}


/* ============================================================
   ECHAPPER HTML
   ============================================================ */

function echapperHTML(texte) {

    if (texte === null || texte === undefined) {
        return "";
    }

    return String(texte)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* ============================================================
   CHARGER LES EXERCICES
   ============================================================ */

async function chargerExercices() {

    const connexion =
        document.getElementById("connexion");

    const zone =
        document.getElementById("listeExercices");

    connexion.style.display = "block";

    connexion.className = "loading";

    connexion.innerHTML =
        "🔄 Connexion à Supabase...";

    try {

        const url =
            TABLE_URL +
            "?select=*&order=id.desc";

        console.log(
            "Connexion Supabase :",
            url
        );

        const response =
            await fetchAvecTimeout(
                url,
                {
                    method: "GET",
                    headers: headersSupabase(),
                    cache: "no-store"
                },
                15000
            );

        const texte =
            await response.text();

        console.log(
            "Réponse Supabase :",
            response.status,
            texte
        );

        if (!response.ok) {

            connexion.className =
                "error-box";

            connexion.innerHTML =
                "<strong>❌ Supabase a refusé la requête.</strong><br><br>" +
                "Code HTTP : " +
                response.status +
                "<br><br>" +
                "<strong>Réponse :</strong><br>" +
                echapperHTML(texte);

            zone.innerHTML = "";

            return;

        }

        let donnees;

        try {

            donnees =
                JSON.parse(texte);

        } catch (erreurJSON) {

            throw new Error(
                "Supabase a répondu avec des données qui ne sont pas du JSON valide."
            );

        }

        if (!Array.isArray(donnees)) {

            throw new Error(
                "La réponse Supabase n'est pas une liste d'exercices."
            );

        }

        exercices =
            donnees;

        connexion.className =
            "message";

        connexion.innerHTML =
            "✅ Connexion réussie — " +
            exercices.length +
            " exercice(s) récupéré(s).";

        mettreAJourStats();

        afficherExercices();

        afficherGalerie();

        afficherNotes();

        console.log(
            "Exercices récupérés :",
            exercices
        );

    } catch (erreur) {

        console.error(
            "Erreur chargement :",
            erreur
        );

        connexion.className =
            "error-box";

        if (erreur.name === "AbortError") {

            connexion.innerHTML =
                "<strong>❌ La connexion à Supabase a dépassé 15 secondes.</strong><br><br>" +
                "La page ne restera plus bloquée indéfiniment.<br>" +
                "Vérifie la connexion Internet et recharge la page.";

        } else {

            connexion.innerHTML =
                "<strong>❌ Impossible de charger les exercices.</strong><br><br>" +
                echapperHTML(
                    erreur.message
                );

        }

        zone.innerHTML = "";

    }

}


/* ============================================================
   STATISTIQUES
   ============================================================ */

function mettreAJourStats() {

    document.getElementById("statExercices").textContent =
        exercices.length;

    document.getElementById("statPhotos").textContent =
        exercices.filter(
            e => e.photo_url
        ).length;

    document.getElementById("statVideos").textContent =
        exercices.filter(
            e => e.video_url
        ).length;

}


/* ============================================================
   AFFICHER EXERCICES
   ============================================================ */

function afficherExercices() {

    const zone =
        document.getElementById("listeExercices");

    const recherche =
        document.getElementById("recherche")
        .value
        .toLowerCase()
        .trim();

    let liste =
        [...exercices];

    if (modePhotos) {

        liste =
            liste.filter(
                e => e.photo_url
            );

    } else if (filtreActuel !== "TOUS") {

        liste =
            liste.filter(
                e =>
                    String(
                        e.categorie || ""
                    )
                    .toLowerCase() ===
                    filtreActuel.toLowerCase()
            );

    }

    if (recherche) {

        liste =
            liste.filter(e => {

                const nom =
                    String(
                        e.nom || ""
                    ).toLowerCase();

                const description =
                    String(
                        e.description || ""
                    ).toLowerCase();

                const categorie =
                    String(
                        e.categorie || ""
                    ).toLowerCase();

                return (
                    nom.includes(recherche) ||
                    description.includes(recherche) ||
                    categorie.includes(recherche)
                );

            });

    }

    if (liste.length === 0) {

        zone.innerHTML =
            '<div class="empty">Aucun exercice dans cette catégorie.</div>';

        return;

    }

    zone.innerHTML =
        liste.map(e => {

            const nom =
                echapperHTML(e.nom);

            const categorie =
                echapperHTML(e.categorie);

            const description =
                echapperHTML(e.description);

            let html = `
                <div class="card">

                    <h3>${nom}</h3>

                    <div class="info">
                        🏷️ ${categorie}<br>
                        💪 ${e.series || 0} séries ×
                        ${e.repetitions || 0} répétitions
                    </div>
            `;

            if (description) {

                html += `
                    <p class="info">
                        📝 ${description}
                    </p>
                `;

            }

            if (e.video_url) {

                html += `
                    <video
                        class="video"
                        controls
                        preload="metadata"
                        src="${echapperHTML(e.video_url)}">
                    </video>
                `;

            }

            if (e.photo_url) {

                html += `
                    <img
                        class="photo"
                        src="${echapperHTML(e.photo_url)}"
                        alt="${nom}"
                        loading="lazy">
                `;

            }

            html += `

                    <div class="actions">

                        <button
                            class="edit"
                            onclick="modifierExercice(${Number(e.id)})">
                            ✏️ Modifier
                        </button>

                        <button
                            class="delete"
                            onclick="supprimerExercice(${Number(e.id)})">
                            🗑️ Supprimer
                        </button>

                    </div>

                </div>
            `;

            return html;

        }).join("");

}


/* ============================================================
   FILTRE CATEGORIE
   ============================================================ */

function filtrerCategorie(
    categorie,
    bouton
) {

    modePhotos = false;

    filtreActuel =
        categorie;

    document.querySelectorAll(
        ".category"
    )
    .forEach(
        b => b.classList.remove("active")
    );

    document.querySelectorAll(
        ".toolbar button"
    )
    .forEach(
        b => b.classList.remove("active")
    );

    bouton.classList.add("active");

    afficherExercices();

}


/* ============================================================
   PHOTOS
   ============================================================ */

function filtrerPhotos(bouton) {

    modePhotos = true;

    filtreActuel =
        "PHOTOS";

    document.querySelectorAll(
        ".category"
    )
    .forEach(
        b => b.classList.remove("active")
    );

    document.querySelectorAll(
        ".toolbar button"
    )
    .forEach(
        b => b.classList.remove("active")
    );

    bouton.classList.add("active");

    afficherExercices();

}


/* ============================================================
   TOUS
   ============================================================ */

function afficherTous(bouton) {

    modePhotos = false;

    filtreActuel =
        "TOUS";

    document.querySelectorAll(
        ".category"
    )
    .forEach(
        b => b.classList.remove("active")
    );

    document.querySelectorAll(
        ".toolbar button"
    )
    .forEach(
        b => b.classList.remove("active")
    );

    bouton.classList.add("active");

    afficherExercices();

}


/* ============================================================
   UPLOAD STORAGE
   ============================================================ */

async function envoyerFichier(
    fichier,
    prefixe
) {

    if (!fichier) {
        return null;
    }

    const extension =
        fichier.name.includes(".")
            ? fichier.name.substring(
                fichier.name.lastIndexOf(".")
            )
            : "";

    const nomFichier =
        prefixe +
        "_" +
        Date.now() +
        "_" +
        Math.random()
            .toString(36)
            .substring(2, 9) +
        extension;

    const url =
        STORAGE_URL +
        "/" +
        encodeURIComponent(
            nomFichier
        );

    const response =
        await fetchAvecTimeout(
            url,
            {
                method: "POST",

                headers: {
                    "apikey":
                        SUPABASE_KEY,

                    "x-upsert":
                        "false",

                    "Content-Type":
                        fichier.type ||
                        "application/octet-stream"
                },

                body: fichier
            },
            60000
        );

    const texte =
        await response.text();

    if (!response.ok) {

        console.error(
            "Erreur upload :",
            response.status,
            texte
        );

        throw new Error(
            "Erreur upload : " +
            texte
        );

    }

    return (
        SUPABASE_URL +
        "/storage/v1/object/public/medias/" +
        nomFichier
    );

}


/* ============================================================
   SAUVEGARDER
   ============================================================ */

async function sauvegarderExercice() {

    const id =
        document.getElementById(
            "exerciceId"
        ).value;

    const nom =
        document.getElementById(
            "nom"
        ).value.trim();

    const categorie =
        document.getElementById(
            "categorie"
        ).value;

    const series =
        parseInt(
            document.getElementById(
                "series"
            ).value
        ) || 0;

    const repetitions =
        parseInt(
            document.getElementById(
                "repetitions"
            ).value
        ) || 0;

    const description =
        document.getElementById(
            "description"
        ).value.trim();

    const videoFile =
        document.getElementById(
            "video"
        ).files[0];

    const photoFile =
        document.getElementById(
            "photo"
        ).files[0];

    if (!nom) {

        alert(
            "Entre le nom de l'exercice."
        );

        return;

    }

    try {

        message(
            "⏳ Enregistrement en cours..."
        );

        let videoUrl =
            null;

        let photoUrl =
            null;

        if (videoFile) {

            message(
                "⏳ Envoi de la vidéo..."
            );

            videoUrl =
                await envoyerFichier(
                    videoFile,
                    "video"
                );

        }

        if (photoFile) {

            message(
                "⏳ Envoi de la photo..."
            );

            photoUrl =
                await envoyerFichier(
                    photoFile,
                    "photo"
                );

        }

        if (id) {

            const ancien =
                exercices.find(
                    e =>
                        String(e.id) ===
                        String(id)
                );

            const donnees = {
                nom,
                categorie,
                series,
                repetitions,
                description
            };

            if (videoUrl) {

                donnees.video_url =
                    videoUrl;

            } else if (ancien) {

                donnees.video_url =
                    ancien.video_url ||
                    null;

            }

            if (photoUrl) {

                donnees.photo_url =
                    photoUrl;

            } else if (ancien) {

                donnees.photo_url =
                    ancien.photo_url ||
                    null;

            }

            const response =
                await fetchAvecTimeout(
                    TABLE_URL +
                    "?id=eq." +
                    encodeURIComponent(id),
                    {
                        method: "PATCH",

                        headers: {
                            ...headersSupabase(),
                            "Prefer":
                                "return=representation"
                        },

                        body:
                            JSON.stringify(
                                donnees
                            )
                    },
                    15000
                );

            const texte =
                await response.text();

            if (!response.ok) {

                throw new Error(
                    texte
                );

            }

            message(
                "✅ Exercice modifié avec succès."
            );

        } else {

            const donnees = {
                nom,
                categorie,
                series,
                repetitions,
                description,
                video_url:
                    videoUrl,
                photo_url:
                    photoUrl
            };

            const response =
                await fetchAvecTimeout(
                    TABLE_URL,
                    {
                        method: "POST",

                        headers: {
                            ...headersSupabase(),
                            "Prefer":
                                "return=representation"
                        },

                        body:
                            JSON.stringify(
                                donnees
                            )
                    },
                    15000
                );

            const texte =
                await response.text();

            if (!response.ok) {

                throw new Error(
                    texte
                );

            }

            message(
                "✅ Exercice enregistré avec succès."
            );

        }

        viderFormulaire();

        await chargerExercices();

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    } catch (erreur) {

        console.error(
            erreur
        );

        message(
            "❌ Erreur : " +
            echapperHTML(
                erreur.message
            )
        );

    }

}


/* ============================================================
   MODIFIER
   ============================================================ */

function modifierExercice(id) {

    const exercice =
        exercices.find(
            e =>
                Number(e.id) ===
                Number(id)
        );

    if (!exercice) {

        alert(
            "Exercice introuvable."
        );

        return;

    }

    document.getElementById(
        "exerciceId"
    ).value =
        exercice.id;

    document.getElementById(
        "nom"
    ).value =
        exercice.nom || "";

    document.getElementById(
        "categorie"
    ).value =
        exercice.categorie ||
        "Pectoraux";

    document.getElementById(
        "series"
    ).value =
        exercice.series || 4;

    document.getElementById(
        "repetitions"
    ).value =
        exercice.repetitions || 10;

    document.getElementById(
        "description"
    ).value =
        exercice.description || "";

    document.getElementById(
        "titreFormulaire"
    ).textContent =

    ).scrollIntoView({

}

   ============================================================ */

function annulerModification() {

function viderFormulaire() {

        "exerciceId"
    ).value = "";

    document.getElementById(
        "nom"
    ).value = "";

    document.getElementById(
        "description"
    ).value = "";

    document.getElementById(
        "video"
    ).value = "";

    document.getElementById(
        "photo"
    ).value = "";

        "series"
    ).value = 4;

    document.getElementById(

/* ============================================================
   SUPPRIMER
   ============================================================ */

async function supprimerExercice(id) {

    const exercice =
        exercices.find(
            e =>
                Number(e.id) ===
                Number(id)
        );

    if (!exercice) {
        return;
    }

    const confirmation =
        confirm(
            "Supprimer « " +
            exercice.nom +
            " » ?"
        );

    if (!confirmation) {
        return;
    }

    try {

        message(
            "⏳ Suppression..."
        );

        const response =
            await fetchAvecTimeout(
                TABLE_URL +
                "?id=eq." +
                encodeURIComponent(id),
                {
                    method: "DELETE",
                    headers:
                        headersSupabase()
                },
                15000
            );

        const texte =
            await response.text();

        if (!response.ok) {

            throw new Error(
                texte
            );

        }

        message(
            "✅ Exercice supprimé."
        );

        await chargerExercices();

    } catch (erreur) {

        console.error(
            erreur
        );

        message(
            "❌ Erreur de suppression : " +
            echapperHTML(
                erreur.message
            )
        );

    }

}


/* ============================================================
   GALERIE
   ============================================================ */

function afficherGalerie() {

    const galerie =
        document.getElementById(
            "galerie"
        );

    const photos =
        exercices.filter(
            e => e.photo_url
        );

    if (photos.length === 0) {

        galerie.innerHTML =
            '<div class="empty">Aucune photo</div>';

        return;

    }

    galerie.innerHTML =
        photos.map(e => {

            const url =
                echapperHTML(
                    e.photo_url
                );

            return `
                <img
                    src="${url}"
                    alt="${echapperHTML(e.nom)}"
                    loading="lazy"
                    onclick="window.open('${url}', '_blank')">
            `;

        }).join("");

}


/* ============================================================
   NOTES
   ============================================================ */

function afficherNotes() {

    const zone =
        document.getElementById(
            "notes"
        );

    const notes =
        exercices.filter(
            e =>
                e.description &&
                String(
                    e.description
                ).trim() !== ""
        );

    if (notes.length === 0) {

        zone.innerHTML =
            '<div class="empty">Aucune note</div>';

        return;

    }

    zone.innerHTML =
        notes.map(e => {

            return `
                <div class="card">

                    <h3>
                        ${echapperHTML(e.nom)}
                    </h3>

                    <div class="info">
                        ${echapperHTML(e.description)}
                    </div>

                </div>
            `;

        }).join("");

}
