<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon Carnet Musculation</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
    margin:0;
    padding:20px;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
}

h1{
    text-align:center;
}

.container{
    max-width:700px;
    margin:auto;
}

.card{
    background:#1e1e1e;
    padding:20px;
    border-radius:15px;
    margin-top:20px;
}

input,select,textarea{
    width:100%;
    box-sizing:border-box;
    padding:12px;
    margin:8px 0 15px;
    background:#111;
    color:white;
    border:1px solid #555;
    border-radius:8px;
}

textarea{
    min-height:100px;
}

button{
    width:100%;
    padding:15px;
    border:0;
    border-radius:10px;
    background:#00c853;
    color:white;
    font-size:16px;
    font-weight:bold;
}

#message{
    margin-top:15px;
    padding:12px;
    text-align:center;
    border-radius:8px;
}

.exercice{
    background:#222;
    padding:15px;
    margin-top:12px;
    border-radius:10px;
}
</style>
</head>

<body>

<div class="container">

<h1>🏋️ Mon Carnet Musculation</h1>

<div class="card">

<h2>➕ Ajouter un exercice</h2>

<label>Catégorie</label>

<select id="categorie">
<option>Pectoraux</option>
<option>Dos</option>
<option>Épaules</option>
<option>Biceps</option>
<option>Triceps</option>
<option>Jambes</option>
<option>Abdos</option>
<option>Photos</option>
<option>Notes</option>
</select>

<label>Nom</label>

<input id="nom" type="text" placeholder="Exemple : Développé couché">

<label>Description</label>

<textarea id="description" placeholder="Description"></textarea>

<label>Séries</label>

<input id="series" type="number" placeholder="4">

<label>Répétitions</label>

<input id="repetitions" type="number" placeholder="10">

<button id="bouton">
💾 ENREGISTRER
</button>

<div id="message"></div>

</div>

<div class="card">

<h2>📚 Mes exercices</h2>

<div id="liste">
Chargement...
</div>

</div>

</div>

<script>

const SUPABASE_URL =
"https://cjtgjwepiotuhtfqwanw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_DXMY1V9ir7R_vwuFysSWwA_Pe-r5NNP";

const client =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


const bouton =
document.getElementById("bouton");

const message =
document.getElementById("message");


bouton.addEventListener(
    "click",
    async function(){

        message.innerHTML =
        "⏳ Le bouton fonctionne...";

        try{

            const categorie =
            document.getElementById(
                "categorie"
            ).value;

            const nom =
            document.getElementById(
                "nom"
            ).value.trim();

            const description =
            document.getElementById(
                "description"
            ).value.trim();

            const series =
            document.getElementById(
                "series"
            ).value;

            const repetitions =
            document.getElementById(
                "repetitions"
            ).value;


            if(!nom){

                message.innerHTML =
                "⚠️ Entre d'abord un nom.";

                return;
            }


            message.innerHTML =
            "⏳ Connexion à Supabase...";


            const resultat =
            await client
            .from("exercices")
            .insert({

                nom: nom,

                categorie: categorie,

                description:
                description || null,

                series:
                series
                ? Number(series)
                : null,

                repetitions:
                repetitions
                ? Number(repetitions)
                : null

            })
            .select();


            if(resultat.error){

                message.innerHTML =
                "❌ ERREUR SUPABASE : " +
                resultat.error.message;

                return;
            }


            message.innerHTML =
            "✅ EXERCICE ENREGISTRÉ !";


            document.getElementById(
                "nom"
            ).value = "";

            document.getElementById(
                "description"
            ).value = "";

            document.getElementById(
                "series"
            ).value = "";

            document.getElementById(
                "repetitions"
            ).value = "";


            chargerExercices();

        }
        catch(erreur){

            message.innerHTML =
            "❌ ERREUR : " +
            erreur.message;

        }

    }
);


async function chargerExercices(){

    const liste =
    document.getElementById(
        "liste"
    );


    const resultat =
    await client
    .from("exercices")
    .select("*")
    .order(
        "id",
        {
            ascending:false
        }
    );


    if(resultat.error){

        liste.innerHTML =
        "❌ " +
        resultat.error.message;

        return;
    }


    if(!resultat.data.length){

        liste.innerHTML =
        "Aucun exercice enregistré.";

        return;
    }


    liste.innerHTML = "";


    resultat.data.forEach(
        function(exercice){

            const div =
            document.createElement(
                "div"
            );

            div.className =
            "exercice";


            div.innerHTML =
            "<h3>" +
            exercice.nom +
            "</h3>" +

            "<p>📂 " +
            (
                exercice.categorie || ""
            ) +
            "</p>" +

            "<p>" +
            (
                exercice.description || ""
            ) +
            "</p>" +

            "<p>🔢 " +
            (
                exercice.series || "-"
            ) +
            " séries × " +
            (
                exercice.repetitions || "-"
            ) +
            " répétitions</p>";


            liste.appendChild(div);

        }
    );

}


chargerExercices();

</script>

</body>
</html>
