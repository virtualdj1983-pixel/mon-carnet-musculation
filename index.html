<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon Carnet Musculation</title>
<style>
*{box-sizing:border-box}
:root{--o:#ff7a00;--o2:#ff9d3d;--o3:#d95f00;--m:#a1a1a1;--g:#22c55e;--y:#facc15;--r:#ef4444}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at top,#211306 0%,#0b0b0b 35%,#050505 100%);color:#fff;min-height:100vh}
button,input,select,textarea{font-family:inherit}
.container{width:94%;max-width:1150px;margin:auto}
header{background:linear-gradient(135deg,#080808,#17100a 50%,#0b0b0b);border-bottom:1px solid #3b220d;padding:32px 18px 28px;text-align:center}
.logo{display:inline-flex;align-items:center;justify-content:center;width:66px;height:66px;border-radius:20px;background:linear-gradient(145deg,var(--o),var(--o3));box-shadow:0 10px 35px rgba(255,122,0,.25);font-size:32px;margin-bottom:12px}
header h1{margin:0;font-size:29px;font-weight:900}
header h1 span{color:var(--o)}
header p{margin:9px 0 0;color:var(--m);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}
.stat{background:linear-gradient(145deg,#181818,#111);border:1px solid #2c2c2c;border-bottom:3px solid var(--o);border-radius:17px;padding:18px 10px;text-align:center}
.stat strong{display:block;font-size:28px;font-weight:900;color:var(--o)}
.stat span{display:block;margin-top:5px;color:var(--m);font-size:12px;text-transform:uppercase}
.section-title{display:flex;align-items:center;gap:10px;margin:30px 0 14px}
.section-title h2{margin:0;font-size:21px}
.section-title .line{flex:1;height:1px;background:linear-gradient(90deg,#3b260f,transparent)}
.categories{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.category{border:1px solid #2c2c2c;border-radius:13px;padding:15px 10px;background:linear-gradient(145deg,#1a1a1a,#111);color:#eee;font-size:14px;font-weight:800;cursor:pointer}
.category:hover{border-color:var(--o)}
.category.active,.toolbar button.active{background:linear-gradient(135deg,var(--o),var(--o3));border-color:var(--o);color:#fff}
.toolbar{margin-top:20px;display:flex;gap:10px;flex-wrap:wrap}
.toolbar button{border:1px solid #333;padding:13px 18px;border-radius:12px;background:#181818;color:#fff;cursor:pointer;font-weight:800}
.search-wrapper{position:relative;margin:17px 0}
.search-icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);pointer-events:none}
.search{padding-left:45px!important}
.loading,.message,.error-box{border-radius:13px;padding:14px 16px;margin:15px 0;word-break:break-word}
.loading{background:#151515;border:1px solid #292929;color:var(--o2);text-align:center}
.message{background:#171717;border:1px solid #333;color:#ddd}
.message:empty{display:none}
.error-box{background:#351515;border:1px solid #8f2929;color:#fecaca;line-height:1.5}
.card{position:relative;overflow:hidden;background:linear-gradient(145deg,#1a1a1a,#111);border:1px solid #292929;border-left:4px solid var(--o);border-radius:19px;padding:19px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:20px}
.info{color:#c8c8c8;line-height:1.6;white-space:pre-wrap}
.exercise-category{display:inline-block;margin-bottom:8px;padding:5px 9px;border-radius:999px;background:rgba(255,122,0,.1);color:var(--o2);font-size:12px;font-weight:bold}
.performance{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}
.performance-box{background:#0d0d0d;border:1px solid #292929;border-radius:13px;padding:14px 10px;text-align:center}
.performance-label{display:block;color:#777;font-size:11px;margin-bottom:7px;text-transform:uppercase;font-weight:bold}
.performance-value{display:block;font-size:17px;font-weight:900}
.weight-value{color:var(--o)}
.charge-leger{color:var(--y)}.charge-correct{color:var(--g)}.charge-lourd{color:var(--r)}
.video,.photo{width:100%;max-height:500px;margin-top:14px;border-radius:14px;background:#000;border:1px solid #292929}
.photo{object-fit:contain}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}
.actions button{border:0;padding:12px 10px;border-radius:11px;color:#fff;cursor:pointer;font-weight:800}
.edit{background:linear-gradient(135deg,#ff8a00,#db5d00)}
.delete{background:#252525;border:1px solid #3a3a3a!important}
.delete:hover{background:#b91c1c}
.form-box{background:linear-gradient(145deg,#191919,#111);border:1px solid #2c2c2c;border-radius:19px;padding:20px;margin-top:28px}
.form-header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.form-icon{width:45px;height:45px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--o),var(--o3));font-size:22px}
.form-header h2{margin:0;font-size:20px}
label{display:block;margin:15px 0 7px;color:#d2d2d2;font-size:13px;font-weight:bold}
input,select,textarea{width:100%;padding:14px;border-radius:11px;border:1px solid #333;outline:none;background:#0d0d0d;color:#fff;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--o)}
textarea{min-height:110px;resize:vertical}
input[type=file]{padding:10px;font-size:14px}
.save{width:100%;margin-top:22px;padding:16px;border:0;border-radius:13px;background:linear-gradient(135deg,var(--o),var(--o3));color:#fff;font-size:17px;font-weight:900;cursor:pointer}
.cancel{width:100%;margin-top:10px;padding:13px;border:1px solid #3a3a3a;border-radius:11px;background:#222;color:#fff;cursor:pointer;display:none}
.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.gallery img{width:100%;height:180px;object-fit:cover;border-radius:13px;cursor:pointer;border:1px solid #292929}
.gallery img:hover{border-color:var(--o)}
.empty{background:#141414;border:1px dashed #353535;border-radius:14px;padding:24px 15px;color:#777;text-align:center}
.note{background:#141414;border:1px solid #292929;border-radius:13px;padding:14px;margin-bottom:10px}
.note b{color:var(--o2)}
footer{text-align:center;padding:35px 15px;color:#666;font-size:12px}
.category img{width:100%;max-width:150px;height:auto;aspect-ratio:1/1;margin:0 auto 8px;display:block;filter:drop-shadow(0 4px 10px rgba(255,122,0,.15));transition:.2s}
.category:hover img{transform:scale(1.05)}
.schema{width:100%;border-radius:19px;border:1px solid #292929;display:block}

.prog{margin-top:12px;background:#0d0d0d;border:1px solid #292929;border-radius:13px;padding:12px}
.prog-title{color:var(--o2);font-weight:bold;font-size:13px;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#1b1b1b;border:1px solid #333;border-radius:9px;padding:6px 9px;font-size:13px;color:#eee}
.chip b{color:var(--o)}
.delta{margin-top:10px;font-size:13px;font-weight:bold;line-height:1.5}
.delta.up{color:var(--g)}.delta.down{color:var(--r)}.delta.same{color:var(--m)}
.delta small{display:block;color:var(--m);font-weight:normal}
details.prog-details{margin-top:10px}
details summary{cursor:pointer;color:var(--o2);font-weight:bold;font-size:13px;padding:6px 0}
.chart{width:100%;height:auto;display:block;margin:8px 0}
.pie-wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:8px 0}
.legend div{font-size:12px;color:#ddd;margin:3px 0;display:flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.sem-item{border-top:1px solid #222;padding:8px 0;font-size:13px;color:#ccc;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.sem-item button{background:#252525;border:1px solid #3a3a3a;color:#fff;border-radius:8px;padding:5px 9px;cursor:pointer}
.btn-sem{width:100%;margin-top:10px;padding:11px;border:1px dashed var(--o);border-radius:11px;background:rgba(255,122,0,.07);color:var(--o2);font-weight:800;cursor:pointer}
.form-sem{display:none;margin-top:10px;background:#141414;border:1px solid #292929;border-radius:12px;padding:12px}
.serie-row{display:grid;grid-template-columns:34px 1fr 1fr;gap:8px;align-items:center;margin-top:8px}
.serie-row span{color:var(--o);font-weight:bold}
.serie-row input,.form-sem input[type=date]{padding:10px;font-size:15px}
.row-btns{display:flex;gap:8px;margin-top:10px}
.row-btns button{flex:1;padding:10px;border-radius:10px;border:1px solid #3a3a3a;background:#222;color:#fff;cursor:pointer;font-weight:bold}
.row-btns .ok{background:linear-gradient(135deg,var(--o),var(--o3));border:0}
.stat-box{background:#141414;border:1px solid #292929;border-radius:14px;padding:14px;margin-bottom:12px}
.stat-box h3{margin:0 0 8px;font-size:16px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;-webkit-user-select:none;user-select:none}
.card-head h3{margin:0 0 6px;font-size:19px}
.card-head .exercise-category{margin-bottom:6px}
.resume{display:block;color:#aaa;font-size:13px}
.chevron{flex:none;font-size:24px;color:var(--o);transition:transform .2s}
.card.open .chevron{transform:rotate(180deg)}
.card-body{display:none;margin-top:12px;padding-top:4px;border-top:1px solid #262626}
.card.open .card-body{display:block}
.card{padding:16px 18px}
.thumb{width:58px;height:58px;object-fit:cover;border-radius:11px;border:1px solid #3a3a3a;flex:none}
.card-head .txt{flex:1;min-width:0}
.card-body .photo{margin:0 0 12px;max-height:420px}
.card-body .video{margin:0 0 12px}
details.sem-details{margin-top:14px;background:#0d0d0d;border:1px solid #292929;border-radius:13px;padding:0 12px}
.sem-details>summary{padding:13px 0;font-size:14px}
.sem-details .prog{margin-top:0;border:0;background:none;padding:0 0 12px}
.card>.photo{display:block;margin:12px 0 0;max-height:480px;cursor:zoom-in}
@media(min-width:700px){.categories{grid-template-columns:repeat(4,1fr)}.gallery{grid-template-columns:repeat(4,1fr)}.gallery img{height:210px}}
</style>
</head>

<script>
const SUPABASE_URL = "https://cjtgjwepiotuhtfqwanw.supabase.co";
const SUPABASE_KEY = "sb_publishable_DXMY1V9ir7R_vwuFysSWwA_Pe-r5NNP";
const TABLE_URL = SUPABASE_URL + "/rest/v1/exercices";
const STORAGE_URL = SUPABASE_URL + "/storage/v1/object/medias";
const PUBLIC_URL = SUPABASE_URL + "/storage/v1/object/public/medias/";

let exercices = [];
let filtreActuel = "TOUS";
let modePhotos = false;

const $ = id => document.getElementById(id);

function headersSupabase() {
  return { "apikey": SUPABASE_KEY, "Content-Type": "application/json" };
}

async function fetchAvecTimeout(url, options = {}, timeout = 15000) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeout);
  try {
    return await fetch(url, { ...options, signal: controller.signal });
  } finally {
    clearTimeout(timer);
  }
}

function message(texte) {
  const zone = $("message");
  if (zone) zone.innerHTML = texte;
}

function echapperHTML(texte) {
  if (texte === null || texte === undefined) return "";
  return String(texte)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function urlMedia(u) {
  if (!u) return "";
  return /^https?:\/\//i.test(u) ? u : PUBLIC_URL + u;
}

/* Poids, charge et historique sont stockés dans la description :
   [POIDS:60] [CHARGE:Correct] [HISTO]json[/HISTO] */
const RE_POIDS = /\[{1,2}POIDS:([0-9]+(?:[.,][0-9]+)?)\]{1,2}\s*/gi;
const RE_CHARGE = /\[{1,2}CHARGE:(Trop léger|Correct|Trop lourd)\]{1,2}\s*/gi;
const RE_HISTO = /\[HISTO\]([\s\S]*?)\[\/HISTO\]\s*/;

function lireHisto(texte) {
  const m = RE_HISTO.exec(String(texte || ""));
  if (!m) return [];
  let brut;
  try { brut = JSON.parse(m[1]); } catch (e) { return []; }
  if (!Array.isArray(brut)) return [];
  return brut
    .filter(h => h && /^\d{4}-\d{2}-\d{2}$/.test(String(h.date)) && Array.isArray(h.series))
    .map(h => ({
      date: String(h.date),
      series: h.series
        .map(s => ({ rep: Math.max(0, Math.round(Number(s && s.rep) || 0)), kg: Math.max(0, Number(s && s.kg) || 0) }))
        .filter(s => s.rep > 0)
    }))
    .filter(h => h.series.length > 0)
    .sort((x, y) => (x.date < y.date ? -1 : x.date > y.date ? 1 : 0));
}

function extraireDonneesMusculation(description) {
  const texte = String(description || "");
  const p = new RegExp(RE_POIDS.source, "i").exec(texte);
  const c = new RegExp(RE_CHARGE.source, "i").exec(texte);
  return {
    poids: p ? p[1].replace(",", ".") : "",
    charge: c ? c[1] : "",
    histo: lireHisto(texte),
    description: texte.replace(RE_HISTO, "").replace(RE_POIDS, "").replace(RE_CHARGE, "").trim()
  };
}

function construireDescription(description, poids, charge, histo) {
  const texte = String(description || "").replace(RE_HISTO, "").replace(RE_POIDS, "").replace(RE_CHARGE, "").trim();
  const infos = [];
  if (poids !== null && poids !== undefined && String(poids).trim() !== "") {
    infos.push("[POIDS:" + String(poids).replace(",", ".") + "]");
  }
  if (["Trop léger", "Correct", "Trop lourd"].includes(charge)) {
    infos.push("[CHARGE:" + charge + "]");
  }
  let res = infos.length > 0 ? infos.join(" ") + (texte ? "\n" + texte : "") : texte;
  if (histo && histo.length > 0) {
    res += (res ? "\n" : "") + "[HISTO]" + JSON.stringify(histo) + "[/HISTO]";
  }
  return res;
}

function classeCharge(charge) {
  if (charge === "Trop léger") return "charge-leger";
  if (charge === "Correct") return "charge-correct";
  if (charge === "Trop lourd") return "charge-lourd";
  return "";
}

/* ---------- CHARGEMENT ---------- */

async function chargerExercices() {
  const connexion = $("connexion");
  const zone = $("listeExercices");
  connexion.style.display = "block";
  connexion.className = "loading";
  connexion.innerHTML = "🔄 Connexion à Supabase...";

  try {
    const response = await fetchAvecTimeout(
      TABLE_URL + "?select=*&order=id.desc",
      { method: "GET", headers: headersSupabase(), cache: "no-store" }
    );
    const texte = await response.text();

    if (!response.ok) {
      connexion.className = "error-box";
      connexion.innerHTML =
        "<strong>❌ ERREUR SUPABASE</strong><br><br>Code HTTP : <strong>" +
        response.status + "</strong><br><br><strong>Réponse :</strong><br>" +
        echapperHTML(texte) + "<br><br>Tes exercices ne sont PAS supprimés.";
      zone.innerHTML = "";
      return;
    }

    let donnees;
    try { donnees = JSON.parse(texte); }
    catch (e) { throw new Error("La réponse de Supabase n'est pas valide."); }

    if (!Array.isArray(donnees)) {
      throw new Error("Supabase n'a pas renvoyé une liste d'exercices.");
    }

    exercices = donnees;
    connexion.className = "message";
    connexion.innerHTML = "🟢 Connexion réussie — " + exercices.length + " exercice(s)";

    mettreAJourStats();
    afficherExercices();
    afficherGalerie();
    afficherNotes();
    afficherStatsGlobales();

  } catch (erreur) {
    console.error("ERREUR SUPABASE :", erreur);
    connexion.className = "error-box";
    if (erreur.name === "AbortError") {
      connexion.innerHTML =
        "<strong>❌ Délai de connexion dépassé.</strong><br><br>" +
        "Supabase n'a pas répondu après 15 secondes.<br><br>Tes exercices ne sont PAS supprimés.";
    } else {
      connexion.innerHTML =
        "<strong>❌ Impossible de contacter Supabase.</strong><br><br><strong>Erreur :</strong><br>" +
        echapperHTML(erreur.message) + "<br><br>Tes données ne sont PAS supprimées.";
    }
    zone.innerHTML = "";
  }
}

function mettreAJourStats() {
  $("statExercices").textContent = exercices.length;
  $("statPhotos").textContent = exercices.filter(e => e.photo_url).length;
  $("statVideos").textContent = exercices.filter(e => e.video_url).length;

/* ---------- AFFICHAGE ---------- */

function afficherExercices() {
  const zone = $("listeExercices");
  const recherche = $("recherche").value.toLowerCase().trim();
  let liste = [...exercices];

  if (modePhotos) {
    liste = liste.filter(e => e.photo_url);
  } else if (filtreActuel !== "TOUS") {
    liste = liste.filter(e => String(e.categorie || "").toLowerCase() === filtreActuel.toLowerCase());
  }

  if (recherche) {
    liste = liste.filter(e =>
      String(e.nom || "").toLowerCase().includes(recherche) ||
      extraireDonneesMusculation(e.description).description.toLowerCase().includes(recherche) ||
      String(e.categorie || "").toLowerCase().includes(recherche)
    );
  }

  if (liste.length === 0) {
    zone.innerHTML = '<div class="empty">Aucun exercice dans cette sélection.</div>';
    return;
  }

  zone.innerHTML = liste.map(function (e) {
    const nom = echapperHTML(e.nom);
    const categorie = echapperHTML(e.categorie);
    const d = extraireDonneesMusculation(e.description);
    const description = echapperHTML(d.description);

    let chargeAffichage = "Non renseignée";
    if (d.charge === "Trop léger") chargeAffichage = "🟡 Trop léger";
    if (d.charge === "Correct") chargeAffichage = "🟢 Correct";
    if (d.charge === "Trop lourd") chargeAffichage = "🔴 Trop lourd";

    const idNum = Number(e.id);
    const photoBig = e.photo_url ? `<img class="photo" src="${echapperHTML(urlMedia(e.photo_url))}" alt="${nom}" loading="lazy" onclick="window.open(this.src,'_blank')">` : "";
    const media = e.video_url ? `<video class="video" controls preload="metadata" src="${echapperHTML(urlMedia(e.video_url))}"></video>` : "";
    const ouvert = ouverts.has(idNum);
    const resume = (e.series || 0) + " séries × " + (e.repetitions || 0) + " rép" + (d.poids ? " • " + echapperHTML(d.poids) + " kg" : "");
    let html = `
      <div class="card${ouvert ? " open" : ""}" id="card_${idNum}">
        <div class="card-head" onclick="basculerCarte(${idNum})">
          <div class="txt">
            <h3>${nom}</h3>
            <div class="exercise-category">🏷️ ${categorie}</div>
            <span class="resume">💪 ${resume}</span>
          </div>
          <span class="chevron">▾</span>
        </div>
        ${photoBig}
        ${blocProgression(e.id, d.histo)}
        <div class="card-body">
        ${media}
        <div class="info">💪 ${e.series || 0} séries × ${e.repetitions || 0} répétitions</div>`;

    if (d.poids || d.charge) {
      html += `
        <div class="performance">
          <div class="performance-box">
            <span class="performance-label">⚖️ Poids</span>
            <span class="performance-value weight-value">${d.poids ? echapperHTML(d.poids) + " kg" : "Non renseigné"}</span>
          </div>
          <div class="performance-box">
            <span class="performance-label">🎯 Charge</span>
            <span class="performance-value ${classeCharge(d.charge)}">${chargeAffichage}</span>
          </div>
        </div>`;
    }

    if (description) html += `<p class="info">📝 ${description}</p>`;


    html += `
        <div class="actions">
          <button class="edit" onclick="modifierExercice(${Number(e.id)})">✏️ Modifier</button>
          <button class="delete" onclick="supprimerExercice(${Number(e.id)})">🗑️ Supprimer</button>
        </div>
        </div>
      </div>`;
    return html;
  }).join("");
}

function afficherGalerie() {

/* ---------- UPLOAD ---------- */

async function envoyerFichier(fichier, prefixe) {
  if (!fichier) return null;

  const extension = fichier.name.includes(".")
    ? fichier.name.substring(fichier.name.lastIndexOf("."))
    : "";
  const nomFichier = prefixe + "_" + Date.now() + "_" +
    Math.random().toString(36).substring(2, 9) + extension;

  const response = await fetchAvecTimeout(
    STORAGE_URL + "/" + encodeURIComponent(nomFichier),
    {
      method: "POST",
      headers: {
        "apikey": SUPABASE_KEY,
        "x-upsert": "false",
        "Content-Type": fichier.type || "application/octet-stream"
      },
      body: fichier
    },
    60000
  );

  const texte = await response.text();
  if (!response.ok) throw new Error("Erreur upload : " + texte);

  return PUBLIC_URL + nomFichier;
}

/* ---------- SAUVEGARDER ---------- */

async function sauvegarderExercice() {
  const id = $("exerciceId").value;
  const nom = $("nom").value.trim();
  const categorie = $("categorie").value;
  const series = parseInt($("series").value) || 0;
  const repetitions = parseInt($("repetitions").value) || 0;
  const poids = $("poids").value.trim();
  const charge = $("charge").value;
  const ancienEx = id ? exercices.find(e => String(e.id) === String(id)) : null;
  let histoInitial = ancienEx ? extraireDonneesMusculation(ancienEx.description).histo : [];
  if (!ancienEx && poids !== "" && series > 0 && repetitions > 0) {
    const kg0 = parseFloat(String(poids).replace(",", ".")) || 0;
    histoInitial = [{ date: aujourdhui(), series: Array.from({ length: series }, () => ({ rep: repetitions, kg: kg0 })) }];
  }
  const description = construireDescription($("description").value.trim(), poids, charge, histoInitial);
  const videoFile = $("video").files[0];
  const photoFile = $("photo").files[0];

  if (!nom) {
    alert("Entre le nom de l'exercice.");
    return;
  }

  try {
    message("⏳ Enregistrement en cours...");

    let videoUrl = null;
    let photoUrl = null;

    if (videoFile) {
      message("⏳ Envoi de la vidéo...");
      videoUrl = await envoyerFichier(videoFile, "video");
    }
    if (photoFile) {
      message("⏳ Envoi de la photo...");
      photoUrl = await envoyerFichier(photoFile, "photo");
    }

    const donnees = { nom, categorie, series, repetitions, description };
    let url = TABLE_URL;
    let methode = "POST";

    if (id) {
      const ancien = exercices.find(e => String(e.id) === String(id));
      donnees.video_url = videoUrl || (ancien ? ancien.video_url || null : null);
      donnees.photo_url = photoUrl || (ancien ? ancien.photo_url || null : null);
      url = TABLE_URL + "?id=eq." + encodeURIComponent(id);
      methode = "PATCH";
    } else {
      donnees.video_url = videoUrl;
      donnees.photo_url = photoUrl;
    }

    const response = await fetchAvecTimeout(url, {
      method: methode,
      headers: { ...headersSupabase(), "Prefer": "return=representation" },
      body: JSON.stringify(donnees)
    }, 15000);

    const texte = await response.text();
    if (!response.ok) throw new Error("Erreur enregistrement : " + texte);

    message("✅ Exercice enregistré !");
    reinitialiserFormulaire();
    await chargerExercices();

  } catch (erreur) {
    console.error(erreur);
    message("❌ " + echapperHTML(erreur.name === "AbortError" ? "Délai dépassé." : erreur.message));
  }
}

/* ---------- SUIVI PAR SÉRIE / SEMAINES ---------- */

const PALETTE = ["#ff7a00","#3b82f6","#22c55e","#a855f7","#facc15","#ef4444","#06b6d4","#ec4899","#84cc16","#f97316"];
const CAT_COULEURS = {"Pectoraux":"#ff7a00","Dos":"#3b82f6","Épaules":"#facc15","Biceps":"#22c55e","Triceps":"#a855f7","Jambes":"#ef4444","Abdos":"#06b6d4"};

function aujourdhui() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function arrondi(v) { return Math.round(v * 10) / 10; }
function signe(v) { return (v > 0 ? "+" : "") + arrondi(v); }
function dateCourte(iso) { const p = iso.split("-"); return p[2] + "/" + p[1]; }
function dateLongue(iso) { const p = iso.split("-"); return p[2] + "/" + p[1] + "/" + p[0]; }
function kgMax(h) { return Math.max(0, ...h.series.map(s => s.kg)); }
function volumeSeance(h) { return h.series.reduce((t, s) => t + s.rep * s.kg, 0); }
function repsSeance(h) { return h.series.reduce((t, s) => t + s.rep, 0); }
function trouverExercice(id) { return exercices.find(e => Number(e.id) === Number(id)); }

function texteDelta(histo) {
  if (histo.length < 2) return "";
  const a = histo[histo.length - 1], b = histo[histo.length - 2], f = histo[0];
  const dk = kgMax(a) - kgMax(b);
  const ds = a.series.length - b.series.length;
  const dv = volumeSeance(a) - volumeSeance(b);
  const pos = dk > 0 || ds > 0 || dv > 0;
  const neg = dk < 0 || ds < 0 || dv < 0;
  const cls = pos && !neg ? "up" : (neg && !pos ? "down" : "same");
  const icone = cls === "up" ? "⬆️" : (cls === "down" ? "⬇️" : "➡️");
  let html = `<div class="delta ${cls}">${icone} ${signe(dk)} kg (charge max) • ${signe(ds)} série(s) • ${signe(dv)} kg de volume` +
    `<small>par rapport à la séance du ${dateLongue(b.date)}</small>`;
  if (histo.length > 2) {
    html += `<small>Depuis le début (${dateLongue(f.date)}) : ${signe(kgMax(a) - kgMax(f))} kg • ${signe(a.series.length - f.series.length)} série(s)</small>`;
  }
  return html + "</div>";
}

function graphiqueEvolution(histo) {
  const W = 320, H = 150, pl = 36, pr = 14, pt = 18, pb = 26;
  const vals = histo.map(kgMax);
  let mn = Math.min(...vals), mx = Math.max(...vals);
  if (mx === mn) { mn = Math.max(0, mn - 5); mx = mx + 5; }
  const marge = (mx - mn) * 0.15;
  mn = Math.max(0, mn - marge); mx = mx + marge;
  const x = i => histo.length === 1 ? W / 2 : pl + i * (W - pl - pr) / (histo.length - 1);
  const y = v => pt + (H - pt - pb) * (1 - (v - mn) / ((mx - mn) || 1));
  const pas = Math.ceil(histo.length / 6);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  s += `<line x1="${pl}" y1="${y(mn)}" x2="${W - pr}" y2="${y(mn)}" stroke="#333"/>`;
  s += `<line x1="${pl}" y1="${y(mx)}" x2="${W - pr}" y2="${y(mx)}" stroke="#222"/>`;
  s += `<text x="${pl - 4}" y="${y(mn) + 3}" text-anchor="end" font-size="9" fill="#888">${arrondi(mn)}</text>`;
  s += `<text x="${pl - 4}" y="${y(mx) + 3}" text-anchor="end" font-size="9" fill="#888">${arrondi(mx)}</text>`;
  if (histo.length > 1) {
    s += `<polyline fill="none" stroke="#ff7a00" stroke-width="2.5" points="${vals.map((v, i) => x(i) + "," + y(v)).join(" ")}"/>`;
  }
  vals.forEach((v, i) => {
    s += `<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="#ff7a00" stroke="#111" stroke-width="1.5"/>`;
    s += `<text x="${x(i)}" y="${y(v) - 8}" text-anchor="middle" font-size="9" fill="#ff9d3d">${arrondi(v)}</text>`;
    if (i % pas === 0 || i === vals.length - 1) {
      s += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="9" fill="#aaa">${dateCourte(histo[i].date)}</text>`;
    }
  });
  return `<div class="prog-title">📈 Charge max par semaine (kg)</div>` + s + "</svg>";
}

function camembert(items, taille) {
  items = items.filter(i => i.value > 0);
  const total = items.reduce((t, i) => t + i.value, 0);
  if (!total) return "";
  const c = taille / 2, r = taille / 2 - 4;
  let ang = -Math.PI / 2;
  let svg = `<svg viewBox="0 0 ${taille} ${taille}" width="${taille}" height="${taille}" xmlns="http://www.w3.org/2000/svg">`;
  items.forEach(it => {
    const frac = it.value / total;
    if (frac >= 0.9999) {
      svg += `<circle cx="${c}" cy="${c}" r="${r}" fill="${it.color}"/>`;
      return;
    }
    const a2 = ang + frac * 2 * Math.PI;
    const x1 = c + r * Math.cos(ang), y1 = c + r * Math.sin(ang);
    const x2 = c + r * Math.cos(a2), y2 = c + r * Math.sin(a2);
    svg += `<path d="M${c} ${c} L${x1} ${y1} A${r} ${r} 0 ${frac > 0.5 ? 1 : 0} 1 ${x2} ${y2} Z" fill="${it.color}" stroke="#111" stroke-width="1.5"/>`;
    ang = a2;
  });
  svg += "</svg>";
  const legende = items.map(it =>
    `<div><i style="background:${it.color}"></i>${echapperHTML(it.label)} — ${Math.round(it.value / total * 100)}%</div>`
  ).join("");
  return `<div class="pie-wrap">${svg}<div class="legend">${legende}</div></div>`;
}

function blocProgression(id, histo) {
  id = Number(id);
  const ouvertSem = histo.length === 0 || semOuv.has(id);
  let html = `<details class="prog-details sem-details"${ouvertSem ? " open" : ""} ontoggle="majSem(${id},this.open)"><summary>📅 Semaines (${histo.length})${histo.length ? " — dernière : " + dateLongue(histo[histo.length - 1].date) : ""}</summary><div class="prog">`;
  if (histo.length === 0) {
    html += '<div class="prog-title">📅 Suivi par semaine</div><div class="info" style="font-size:13px">Aucune semaine enregistrée. Ajoute ta première séance pour suivre tes progrès.</div>';
  } else {
    const a = histo[histo.length - 1];
    html += `<div class="prog-title">📅 Dernière séance : ${dateLongue(a.date)}</div><div class="chips">` +
      a.series.map((s, i) => `<span class="chip">Série ${i + 1} : <b>${s.rep}</b> rép × <b>${arrondi(s.kg)}</b> kg</span>`).join("") + "</div>";
    html += texteDelta(histo);
    const liste = histo.map((h, i) =>
      `<div class="sem-item"><div><b>${dateLongue(h.date)}</b><br>${h.series.map((s, j) => "S" + (j + 1) + " " + s.rep + "×" + arrondi(s.kg) + " kg").join(" · ")}</div>` +
      `<button onclick="supprimerSemaine(${id},${i})">🗑️</button></div>`
    ).reverse().join("");
    html += `<div>` +
      graphiqueEvolution(histo) +
      '<div class="prog-title" style="margin-top:12px">🥧 Part du volume par semaine</div>' +
      camembert(histo.map((h, i) => ({ label: dateCourte(h.date), value: volumeSeance(h) || repsSeance(h), color: PALETTE[i % PALETTE.length] })), 120) +
      '<div class="prog-title" style="margin-top:12px">🗓️ Toutes les semaines</div>' + liste + "</div>";
  }
  html += `<button class="btn-sem" onclick="ouvrirSemaine(${id})">➕ Ajouter une semaine</button>
    <div class="form-sem" id="formSem_${id}">
      <label style="margin-top:0">📅 Date de la séance</label>
      <input type="date" id="semDate_${id}">
      <div id="semSeries_${id}"></div>
      <div class="row-btns">
        <button onclick="ajouterLigneSerie(${id})">➕ Série</button>
        <button onclick="retirerLigneSerie(${id})">➖ Série</button>
      </div>
      <div class="row-btns"><button class="ok" onclick="enregistrerSemaine(${id})">💾 Enregistrer la semaine</button></div>
    </div></div></details>`;
  return html;
}

function ajouterLigneSerie(id, rep, kg) {
  const z = $("semSeries_" + id);
  if (!z) return;
  const n = z.children.length + 1;
  const d = document.createElement("div");
  d.className = "serie-row";
  d.innerHTML = `<span>S${n}</span><input type="number" class="sr-rep" min="1" placeholder="rép" value="${typeof rep === "number" ? rep : ""}"><input type="number" class="sr-kg" min="0" step="0.5" placeholder="kg" value="${typeof kg === "number" ? kg : ""}">`;
  z.appendChild(d);
}

function retirerLigneSerie(id) {
  const z = $("semSeries_" + id);
  if (z && z.children.length > 1) z.removeChild(z.lastChild);
}

function ouvrirSemaine(id) {
  const f = $("formSem_" + id);
  if (!f) return;
  if (f.style.display === "block") { f.style.display = "none"; return; }
  const ex = trouverExercice(id);
  if (!ex) return;
  const h = extraireDonneesMusculation(ex.description).histo;
  const base = h.length > 0
    ? h[h.length - 1].series
    : Array.from({ length: ex.series || 4 }, () => ({ rep: ex.repetitions || 10, kg: "" }));
  f.style.display = "block";
  $("semDate_" + id).value = aujourdhui();
  $("semSeries_" + id).innerHTML = "";
  base.forEach(s => ajouterLigneSerie(id, s.rep, s.kg));
}

async function patchExercice(id, donnees) {
  const r = await fetchAvecTimeout(
    TABLE_URL + "?id=eq." + encodeURIComponent(id),
    { method: "PATCH", headers: { ...headersSupabase(), "Prefer": "return=representation" }, body: JSON.stringify(donnees) },
    15000
  );
  const t = await r.text();
  if (!r.ok) throw new Error(t);
  return t;
}

async function enregistrerSemaine(id) {
  const ex = trouverExercice(id);
  if (!ex) return;
  const d = extraireDonneesMusculation(ex.description);
  const date = $("semDate_" + id).value || aujourdhui();
  const series = [...$("semSeries_" + id).children].map(r => ({
    rep: parseInt(r.querySelector(".sr-rep").value) || 0,
    kg: parseFloat(r.querySelector(".sr-kg").value) || 0
  })).filter(s => s.rep > 0);
  if (series.length === 0) { alert("Ajoute au moins une série avec ses répétitions."); return; }
  const histo = d.histo.filter(h => h.date !== date);
  histo.push({ date, series });
  histo.sort((x, y) => (x.date < y.date ? -1 : x.date > y.date ? 1 : 0));
  const dernier = histo[histo.length - 1];
  const description = construireDescription(d.description, kgMax(dernier) || "", d.charge, histo);
  try {
    await patchExercice(id, { series: dernier.series.length, repetitions: dernier.series[0].rep, description });
    await chargerExercices();
  } catch (e) {
    console.error(e);
    alert("Enregistrement impossible : " + (e.name === "AbortError" ? "délai dépassé" : e.message));
  }
}

async function supprimerSemaine(id, index) {
  if (!confirm("Supprimer cette semaine de l'historique ?")) return;
  const ex = trouverExercice(id);
  if (!ex) return;
  const d = extraireDonneesMusculation(ex.description);
  const histo = d.histo.filter((_, i) => i !== index);
  const poids = histo.length > 0 ? (kgMax(histo[histo.length - 1]) || "") : d.poids;
  try {
    await patchExercice(id, { description: construireDescription(d.description, poids, d.charge, histo) });
    await chargerExercices();
  } catch (e) {
    console.error(e);
    alert("Suppression impossible : " + e.message);
  }
}

function afficherStatsGlobales() {
  const z = $("statsGlobales");
  if (!z) return;
  const nb = {}, vol = {};
  exercices.forEach(e => {
    const c = e.categorie || "Autre";
    nb[c] = (nb[c] || 0) + 1;
    extraireDonneesMusculation(e.description).histo.forEach(h => { vol[c] = (vol[c] || 0) + volumeSeance(h); });
  });
  const items = o => Object.keys(o).map(k => ({ label: k, value: o[k], color: CAT_COULEURS[k] || "#888" }));
  const p1 = camembert(items(nb), 150);
  const p2 = camembert(items(vol), 150);
  z.innerHTML =
    `<div class="stat-box"><h3>🏋️ Exercices par muscle</h3>${p1 || '<div class="empty">Pas encore d\'exercice.</div>'}</div>` +
    `<div class="stat-box"><h3>📈 Volume soulevé par muscle (kg × répétitions)</h3>${p2 || '<div class="empty">Ajoute des semaines avec des kilos pour voir ce graphique.</div>'}</div>`;
}

/* ---------- CARTES REPLIABLES ---------- */

const ouverts = new Set();

function basculerCarte(id) {
  id = Number(id);
  const c = $("card_" + id);
  if (!c) return;
  if (c.classList.toggle("open")) ouverts.add(id); else ouverts.delete(id);
}

function toutBasculer() {
  const cartes = [...document.querySelectorAll(".card[id^='card_']")];
  const toutesOuvertes = cartes.length > 0 && cartes.every(c => c.classList.contains("open"));
  cartes.forEach(c => {
    const id = Number(c.id.replace("card_", ""));
    c.classList.toggle("open", !toutesOuvertes);
    if (toutesOuvertes) ouverts.delete(id); else ouverts.add(id);
  });
}

const semOuv = new Set();
function majSem(id, ouvert) { id = Number(id); if (ouvert) semOuv.add(id); else semOuv.delete(id); }

/* ---------- DÉMARRAGE ---------- */

chargerExercices();
