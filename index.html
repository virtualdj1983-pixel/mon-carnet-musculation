<!DOCTYPE html><html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon Carnet Musculation</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}

body{
margin:0;
padding:12px;
background:#090909;
color:#fff;
font-family:Arial,sans-serif
}

.container{
max-width:1100px;
margin:auto
}

header{
text-align:center;
padding:18px 5px
}

header h1{
margin:0;
font-size:29px
}

header p{
color:#999;
margin:8px 0 0
}

.card{
background:#171717;
border:1px solid #292929;
border-radius:16px;
padding:16px;
margin-top:14px
}

h2{
margin-top:0
}

.search{
font-size:17px;
padding:14px
}

.categories{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:8px
}

button{
width:100%;
padding:13px;
border:0;
border-radius:10px;
font-weight:bold;
color:white;
cursor:pointer;
font-size:14px
}

.category{
background:#292929
}

.category:active{
transform:scale(.98)
}

.save{
background:#00c853;
font-size:16px
}

.update{
background:#ff9800
}

.delete{
background:#d50000
}

.cancel{
background:#555;
margin-top:8px
}

input,select,textarea{
width:100%;
padding:13px;
margin:6px 0 14px;
background:#0d0d0d;
color:white;
border:1px solid #444;
border-radius:9px;
font-size:16px
}

textarea{
min-height:100px;
resize:vertical
}

label{
display:block;
font-weight:bold;
margin-top:5px
}

#message{
text-align:center;
margin-top:10px;
padding:10px;
border-radius:8px
}

.hidden{
display:none!important
}

.statsGrid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:8px
}

.stat{
background:#222;
padding:14px;
border-radius:12px;
text-align:center
}

.stat strong{
display:block;
font-size:25px
}

.stat span{
color:#aaa;
font-size:13px
}

.exercise{
background:#222;
border:1px solid #333;
border-radius:14px;
padding:15px;
margin-top:12px
}

.exercise h3{
margin:0 0 6px;
font-size:20px
}

.small{
color:#aaa;
font-size:14px
}

.stats{
background:#151515;
padding:10px;
border-radius:9px;
margin-top:10px
}

.exercise img,
.exercise video{
width:100%;
max-height:450px;
object-fit:contain;
background:#000;
border-radius:10px;
margin-top:10px
}

.actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin-top:10px
}

.note{
background:#242424;
border-left:4px solid #00c853;
border-radius:10px;
padding:14px;
margin-top:10px;
white-space:pre-wrap
}

.gallery{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:8px
}

.galleryItem{
background:#222;
border-radius:10px;
padding:6px
}

.galleryItem img{
width:100%;
height:180px;
object-fit:cover;
border-radius:7px
}

.empty{
text-align:center;
color:#999;
padding:20px
}

@media(min-width:700px){

.categories{
grid-template-columns:repeat(5,1fr)
}

.statsGrid{
grid-template-columns:repeat(4,1fr)
}

.gallery{
grid-template-columns:repeat(4,1fr)
}

}
</style></head><body><div class="container"><header>
<h1>🏋️ Mon Carnet Musculation</h1>
<p>Exercices • vidéos • photos • notes</p>
</header><div class="card"><h2>📊 Mon carnet</h2><div class="statsGrid"><div class="stat">
<strong id="totalExercices">0</strong>
<span>Exercices</span>
</div><div class="stat">
<strong id="totalPhotos">0</strong>
<span>Photos</span>
</div><div class="stat">
<strong id="totalVideos">0</strong>
<span>Vidéos</span>
</div><div class="stat">
<strong id="totalNotes">0</strong>
<span>Notes</span>
</div></div></div><div class="card"><h2>🔎 Rechercher</h2><input
id="recherche"
class="search"
type="search"
placeholder="Rechercher un exercice..."
oninput="rechercher()"

«»

</div><div class="card"><h2>📂 Catégories</h2><div class="categories"><button class="category" onclick="filtrer('Pectoraux')">💪 Pectoraux</button>
<button class="category" onclick="filtrer('Dos')">🔙 Dos</button>
<button class="category" onclick="filtrer('Épaules')">🏋️ Épaules</button>
<button class="category" onclick="filtrer('Biceps')">💪 Biceps</button>
<button class="category" onclick="filtrer('Triceps')">💪 Triceps</button>
<button class="category" onclick="filtrer('Jambes')">🦵 Jambes</button>
<button class="category" onclick="filtrer('Abdos')">🔥 Abdos</button>
<button class="category" onclick="afficherGalerie()">📷 Photos</button>
<button class="category" onclick="afficherNotes()">📝 Notes</button>
<button class="category" onclick="chargerExercices()">🏠 Tout</button>

</div></div><div class="card"><h2 id="titreFormulaire">➕ Ajouter</h2><label>Catégorie</label>

<select id="categorie"><option>Pectoraux</option>
<option>Dos</option>
<option>Épaules</option>
<option>Biceps</option>
<option>Triceps</option>
<option>Jambes</option>
<option>Abdos</option>
<option>Photos</option>
<option>Notes</option></select><label>Nom</label>

<input
id="nom"
type="text"
placeholder="Exemple : Développé couché"

«»

<label>Description / note</label>

<textarea
id="description"
placeholder="Technique, conseils, matériel, notes..."
></textarea><label>Séries</label>

<input
id="series"
type="number"
min="0"
placeholder="4"

«»

<label>Répétitions</label>

<input
id="repetitions"
type="number"
min="0"
placeholder="10"

«»

<label>🎥 Vidéo</label>

<input
id="video"
type="file"
accept="video/*"

«»

<label>📷 Photo</label>

<input
id="photo"
type="file"
accept="image/*"

«»

<button
id="boutonPrincipal"
class="save"
onclick="ajouterExercice()"

«»

💾 ENREGISTRER
</button>

<button
id="boutonAnnuler"
class="cancel hidden"
onclick="annulerModification()"

«»

❌ ANNULER
</button>

<div id="message"></div></div><div class="card"><h2 id="titreListe">📚 Mes exercices</h2><div id="liste">
⏳ Chargement...
</div></div></div><script>

const SUPABASE_URL =
"https://cjtgjwepiotuhtfqwanw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_DXMY1V9ir7R_vwuFysSWwA_Pe-r5NNP";

const client =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let toutesLesDonnees=[];
let exerciceEnModification=null;


async function envoyerFichier(fichier){

if(!fichier){
return null;
}

const nomFichier=
Date.now()+"_"+
Math.random().toString(36).substring(2)+"_"+
fichier.name.replace(
/[^a-zA-Z0-9._-]/g,
"_"
);

const resultat=
await client.storage
.from("medias")
.upload(
nomFichier,
fichier
);

if(resultat.error){
throw resultat.error;
}

return client.storage
.from("medias")
.getPublicUrl(nomFichier)
.data.publicUrl;

}


async function ajouterExercice(){

const message=
document.getElementById("message");

message.innerHTML="⏳ Préparation...";

try{

const categorie=
document.getElementById("categorie").value;

const nom=
document.getElementById("nom").value.trim();

const description=
document.getElementById("description").value.trim();

const series=
document.getElementById("series").value;

const repetitions=
document.getElementById("repetitions").value;

const video=
document.getElementById("video").files[0];

const photo=
document.getElementById("photo").files[0];

if(!nom){

message.innerHTML=
"⚠️ Indique un nom.";

return;
}

let videoUrl=null;
let photoUrl=null;

if(video){

message.innerHTML=
"🎥 Envoi de la vidéo...";

videoUrl=
await envoyerFichier(video);

}

if(photo){

message.innerHTML=
"📷 Envoi de la photo...";

photoUrl=
await envoyerFichier(photo);

}

message.innerHTML=
"☁️ Enregistrement...";

const resultat=
await client
.from("exercices")
.insert({

nom:nom,
categorie:categorie,
description:description||null,
series:series?Number(series):null,
repetitions:repetitions?Number(repetitions):null,
video_url:videoUrl,
photo_url:photoUrl

});

if(resultat.error){
throw resultat.error;
}

message.innerHTML=
"✅ ENREGISTRÉ !";

viderFormulaire();

chargerExercices();

}

catch(erreur){

message.innerHTML=
"❌ ERREUR : "+erreur.message;

}

}


async function chargerExercices(){

const liste=
document.getElementById("liste");

liste.innerHTML=
"⏳ Chargement...";

const resultat=
await client
.from("exercices")
.select("*")
.order("id",{ascending:false});

if(resultat.error){

liste.innerHTML=
"❌ "+resultat.error.message;

return;
}

toutesLesDonnees=
resultat.data||[];

actualiserStats();

document.getElementById("titreListe").innerHTML=
"📚 Mes exercices";

afficher(toutesLesDonnees);

}


function actualiserStats(){

document.getElementById("totalExercices").textContent=
toutesLesDonnees.filter(
e=>e.categorie!=="Photos"&&e.categorie!=="Notes"
).length;

document.getElementById("totalPhotos").textContent=
toutesLesDonnees.filter(
e=>e.photo_url
).length;

document.getElementById("totalVideos").textContent=
toutesLesDonnees.filter(
e=>e.video_url
).length;

document.getElementById("totalNotes").textContent=
toutesLesDonnees.filter(
e=>e.categorie==="Notes"
).length;

}


function afficher(exercices){

const liste=
document.getElementById("liste");

liste.innerHTML="";

if(!exercices.length){

liste.innerHTML=
"<div class='empty'>Aucun résultat.</div>";

return;
}

exercices.forEach(
function(exercice){

const bloc=
document.createElement("div");

bloc.className="exercise";

let html="";

html+=
"<h3>🏋️ "+
securiser(exercice.nom)+
"</h3>";

html+=
"<div class='small'>📂 "+
securiser(exercice.categorie||"")+
"</div>";

if(exercice.description){

html+=
"<p>"+
securiser(exercice.description)+
"</p>";

}

if(
exercice.series!==null||
exercice.repetitions!==null
){

html+=
"<div class='stats'>🔢 <b>"+
(exercice.series??"-")+
"</b> séries × <b>"+
(exercice.repetitions??"-")+
"</b> répétitions</div>";

}

if(exercice.video_url){

html+=
"<video controls playsinline>"+
"<source src='"+
securiser(exercice.video_url)+
"'>"+
"</video>";

}

if(exercice.photo_url){

html+=
"<img src='"+
securiser(exercice.photo_url)+
"' alt='Photo'>";

}

html+=
"<div class='actions'>"+
"<button class='update' onclick='modifierExercice("+
exercice.id+
")'>✏️ Modifier</button>"+
"<button class='delete' onclick='supprimer("+
exercice.id+
")'>🗑️ Supprimer</button>"+
"</div>";

bloc.innerHTML=html;

liste.appendChild(bloc);

}
);

}


function rechercher(){

const texte=
document.getElementById("recherche")
.value
.toLowerCase()
.trim();

if(!texte){

afficher(toutesLesDonnees);

return;
}

const resultats=
toutesLesDonnees.filter(
e=>
(e.nom||"").toLowerCase().includes(texte)||
(e.description||"").toLowerCase().includes(texte)||
(e.categorie||"").toLowerCase().includes(texte)
);

afficher(resultats);

document.getElementById("titreListe").innerHTML=
"🔎 Résultats de recherche";

}


async function filtrer(categorie){

document.getElementById("recherche").value="";

const resultats=
toutesLesDonnees.filter(
e=>e.categorie===categorie
);

document.getElementById("titreListe").innerHTML=
"📂 "+categorie;

afficher(resultats);

}


function afficherGalerie(){

document.getElementById("recherche").value="";

const photos=
toutesLesDonnees.filter(
e=>e.photo_url
);

document.getElementById("titreListe").innerHTML=
"📷 Galerie photos";

const liste=
document.getElementById("liste");

if(!photos.length){

liste.innerHTML=
"<div class='empty'>Aucune photo enregistrée.</div>";

return;
}

liste.innerHTML=
"<div class='gallery'></div>";

const galerie=
liste.querySelector(".gallery");

photos.forEach(
function(photo){

const item=
document.createElement("div");

item.className="galleryItem";

item.innerHTML=
"<img src='"+
securiser(photo.photo_url)+
"' alt='"+
securiser(photo.nom)+
"'>"+
"<div class='small'>"+
securiser(photo.nom)+
"</div>";

galerie.appendChild(item);

}
);

}


function afficherNotes(){

document.getElementById("recherche").value="";

const notes=
toutesLesDonnees.filter(
e=>e.categorie==="Notes"
);

document.getElementById("titreListe").innerHTML=
"📝 Mes notes";

const liste=
document.getElementById("liste");

if(!notes.length){

liste.innerHTML=
"<div class='empty'>Aucune note enregistrée.</div>";

return;
}

liste.innerHTML="";

notes.forEach(
function(note){

const bloc=
document.createElement("div");

bloc.className="note";

bloc.innerHTML=
"<h3>📝 "+
securiser(note.nom)+
"</h3>"+
"<div>"+
securiser(note.description||"")+
"</div>"+
"<div class='actions'>"+
"<button class='update' onclick='modifierExercice("+
note.id+
")'>✏️ Modifier</button>"+
"<button class='delete' onclick='supprimer("+
note.id+
")'>🗑️ Supprimer</button>"+
"</div>";

liste.appendChild(bloc);

}
);

}


async function modifierExercice(id){

const resultat=
await client
.from("exercices")
.select("*")
.eq("id",id)
.single();

if(resultat.error){

alert(
"Erreur : "+resultat.error.message
);

return;
}

const e=resultat.data;

exerciceEnModification=e.id;

document.getElementById("categorie").value=
e.categorie||"Pectoraux";

document.getElementById("nom").value=
e.nom||"";

document.getElementById("description").value=
e.description||"";

document.getElementById("series").value=
e.series??"";

document.getElementById("repetitions").value=
e.repetitions??"";

document.getElementById("titreFormulaire").innerHTML=
"✏️ Modifier";

document.getElementById("boutonPrincipal").innerHTML=
"💾 ENREGISTRER LES MODIFICATIONS";

document.getElementById("boutonPrincipal").onclick=
enregistrerModification;

document.getElementById("boutonAnnuler")
.classList.remove("hidden");

window.scrollTo({
top:0,
behavior:"smooth"
});

}


async function enregistrerModification(){

if(!exerciceEnModification){
return;
}

const message=
document.getElementById("message");

message.innerHTML=
"⏳ Modification...";

try{

const resultat=
await client
.from("exercices")
.update({

categorie:
document.getElementById("categorie").value,

nom:
document.getElementById("nom").value.trim(),

description:
document.getElementById("description").value.trim()||null,

series:
document.getElementById("series").value
?Number(document.getElementById("series").value)
:null,

repetitions:
document.getElementById("repetitions").value
?Number(document.getElementById("repetitions").value)
:null

})
.eq("id",exerciceEnModification);

if(resultat.error){
throw resultat.error;
}

message.innerHTML=
"✅ MODIFICATION ENREGISTRÉE !";

annulerModification();

chargerExercices();

}
catch(erreur){

message.innerHTML=
"❌ ERREUR : "+erreur.message;

}

}


function annulerModification(){

exerciceEnModification=null;

viderFormulaire();

document.getElementById("titreFormulaire").innerHTML=
"➕ Ajouter";

document.getElementById("boutonPrincipal").innerHTML=
"💾 ENREGISTRER";

document.getElementById("boutonPrincipal").onclick=
ajouterExercice;

document.getElementById("boutonAnnuler")
.classList.add("hidden");

}


function viderFormulaire(){

document.getElementById("nom").value="";
document.getElementById("description").value="";
document.getElementById("series").value="";
document.getElementById("repetitions").value="";
document.getElementById("video").value="";
document.getElementById("photo").value="";

}


async function supprimer(id){

if(!confirm("Supprimer cet élément ?")){
return;
}

const resultat=
await client
.from("exercices")
.delete()
.eq("id",id);

if(resultat.error){

alert(
"Erreur : "+resultat.error.message
);

return;
}

chargerExercices();

}


function securiser(texte){

return String(texte)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


chargerExercices();

</script></body>
    </html>
